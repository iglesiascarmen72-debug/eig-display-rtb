  <li>Inventario menos abundante.<\u002Fli>\n              <li>CPM más alto.<\u002Fli>\n              <li>No siempre es ideal para performance pura.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"evo-arrow\" aria-hidden=\"true\">→<\u002Fdiv>\n        <div class=\"evo-col now\">\n          <p class=\"evo-eyebrow\">Ahora · display incluye<\u002Fp>\n          <h4>Formatos ricos y programáticos<\u002Fh4>\n          <div class=\"evo-chips\">\n            <span class=\"hot\">Vídeo<\u002Fspan><span class=\"hot\">Native<\u002Fspan><span class=\"hot\">Rich media<\u002Fspan>\n            <span>Interstitials<\u002Fspan><span>Skins<\u002Fspan>\n            <span>Contextuales<\u002Fspan><span>DCO<\u002Fspan><span>Creatividad dinámica<\u002Fspan>\n            <span>Alto impacto<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin-top:16px;\"><a href=\"https://www.bannerflow.com/blog/display-advertising-best-banner-ads\" target=\"_blank\" rel=\"noopener\" onclick=\"window.open(this.href,'_blank','noopener,width=1200,height=800');return false;\" style=\"display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; color:var(--practica); text-decoration:none; padding:9px 15px; border-radius:999px; border:1px solid #99f6e4; background:var(--practica-bg);\">Ver ejemplos de banners HTML5 →<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Display y vídeo: la frontera se difumina -->\n    <div class=\"panel-card acc-practica\" data-reveal=\"\">\n      <p class=\"evo-headline\">Display y vídeo: <b>la frontera se difumina<\u002Fb>.<\u002Fp>\n      <div class=\"evo-grid\">\n        <div class=\"evo-col before\">\n          <p class=\"evo-eyebrow\">Antes<\u002Fp>\n          <div class=\"evo-chips\">\n            <span>Display = banner<\u002Fspan><span>Vídeo = YouTube / pre-roll<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"evo-arrow\" aria-hidden=\"true\">→<\u002Fdiv>\n        <div class=\"evo-col now\">\n          <p class=\"evo-eyebrow\">Ahora · display puede ser<\u002Fp>\n          <div class=\"evo-chips\" data-evo-chips=\"\">\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"preroll\">Vídeo pre-roll<\u002Fbutton>\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"midroll\">Vídeo mid-roll<\u002Fbutton>\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"outstream\">Outstream video<\u002Fbutton>\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"videobanner\">Vídeo banner<\u002Fbutton>\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"bumper\">Bumper video<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"evo-detail\" data-evo-panel=\"preroll\" hidden=\"\">\n            <p class=\"evo-eyebrow\" style=\"color:#6ee7b7\">Vídeo pre-roll · ventajas<\u002Fp>\n            <ul>\n              <li>Alta atención.<\u002Fli>\n              <li>Muy bueno para storytelling.<\u002Fli>\n              <li>Recuerdo de marca.<\u002Fli>\n            <\u002Ful>\n            <p class=\"evo-eyebrow\" style=\"color:#fca5a5;margin-top:14px\">Desventajas<\u002Fp>\n            <ul>\n              <li>Puede ser percibido como interrupción.<\u002Fli>\n              <li>Riesgo de skip.<\u002Fli>\n              <li>CPM más alto que display estándar.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"evo-detail\" data-evo-panel=\"midroll\" hidden=\"\">\n            <p class=\"evo-eyebrow\" style=\"color:#6ee7b7\">Vídeo mid-roll · ventajas<\u002Fp>\n            <ul>\n              <li>El usuario ya está consumiendo contenido.<\u002Fli>\n              <li>Buena tasa de visualización.<\u002Fli>\n              <li>Bueno para reforzar campañas de notoriedad.<\u002Fli>\n            <\u002Ful>\n            <p class=\"evo-eyebrow\" style=\"color:#fca5a5;margin-top:14px\">Desventajas<\u002Fp>\n            <ul>\n              <li>Más intrusivo que el pre-roll.<\u002Fli>\n              <li>Inventario más limitado.<\u002Fli>\n              <li>Puede tener CPM elevado.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"evo-detail\" data-evo-panel=\"outstream\" hidden=\"\">\n            <p class=\"evo-eyebrow\" style=\"color:#6ee7b7\">Outstream video · ventajas<\u002Fp>\n            <ul>\n              <li>No necesita contenido de vídeo editorial.<\u002Fli>\n              <li>Amplía mucho el inventario de vídeo.<\u002Fli>\n              <li>Buena integración en contenido editorial.<\u002Fli>\n            <\u002Ful>\n            <p class=\"evo-eyebrow\" style=\"color:#fca5a5;margin-top:14px\">Desventajas<\u002Fp>\n            <ul>\n              <li>Atención más variable.<\u002Fli>\n              <li>Calidad de inventario desigual.<\u002Fli>\n              <li>Debe cuidarse la viewability.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"evo-detail\" data-evo-panel=\"videobanner\" hidden=\"\">\n            <p class=\"evo-eyebrow\" style=\"color:#6ee7b7\">Vídeo banner · ventajas<\u002Fp>\n            <ul>\n              <li>Une display y vídeo.<\u002Fli>\n              <li>Más llamativo que un banner estático.<\u002Fli>\n              <li>Bueno para mostrar producto o gameplay.<\u002Fli>\n            <\u002Ful>\n            <p class=\"evo-eyebrow\" style=\"color:#fca5a5;margin-top:14px\">Desventajas<\u002Fp>\n            <ul>\n              <li>Limitaciones técnicas.<\u002Fli>\n              <li>Puede cargar más lento.<\u002Fli>\n              <li>No siempre se reproduce como esperamos.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div class=\"evo-detail\" data-evo-panel=\"bumper\" hidden=\"\">\n            <p class=\"evo-eyebrow\" style=\"color:#6ee7b7\">Bumper video · ventajas<\u002Fp>\n            <ul>\n              <li>Mensaje muy rápido.<\u002Fli>\n              <li>Bueno para frecuencia.<\u002Fli>\n              <li>Útil como refuerzo de campaña.<\u002Fli>\n            <\u002Ful>\n            <p class=\"evo-eyebrow\" style=\"color:#fca5a5;margin-top:14px\">Desventajas<\u002Fp>\n            <ul>\n              <li>No permite explicar demasiado.<\u002Fli>\n              <li>Depende mucho de la creatividad.<\u002Fli>\n              <li>Puede saturar si se repite demasiado.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Ejemplos de vídeo -->\n    <div class=\"panel-card acc-practica\" data-reveal=\"\">\n      <p class=\"blocktitle\" style=\"color:var(--practica)\">Ejemplos de vídeo<\u002Fp>\n      <p class=\"blocklead\">Dos casos reales de cómo el vídeo funciona como formato publicitario.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:14px;\">\n        <a href=\"https://www.youtube.com/watch?v=sLdOys54Jwg\" target=\"_blank\" rel=\"noopener\" style=\"position:relative; display:block; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#000; aspect-ratio:16/9; text-decoration:none;\">\n          <img src=\"dd5e83ce-f970-4448-a66f-c72b374bd831\" alt=\"Ejemplo de vídeo 1\" style=\"width:100%; height:100%; object-fit:cover; display:block;\">\n          <span style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\"><span style=\"width:64px; height:44px; border-radius:12px; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center;\"><span style=\"width:0; height:0; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent #fff;\"><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.youtube.com/watch?v=RcGaTzFV-pw\" target=\"_blank\" rel=\"noopener\" style=\"position:relative; display:block; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#000; aspect-ratio:16/9; text-decoration:none;\">\n          <img src=\"d1b62cc4-5f92-42ad-8865-1651938797da\" alt=\"Ejemplo de vídeo 2\" style=\"width:100%; height:100%; object-fit:cover; display:block;\">\n          <span style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\"><span style=\"width:64px; height:44px; border-radius:12px; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center;\"><span style=\"width:0; height:0; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent #fff;\"><\u002Fspan><\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size:12.5px; color:var(--muted); margin-top:10px;\">Estos vídeos tienen la incrustación deshabilitada por su autor, así que se abren directamente en YouTube al pulsarlos.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- DCO: optimización dinámica de creatividades -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"evo-headline\">DCO · <b>Optimización dinámica de creatividades<\u002Fb>.<\u002Fp>\n      <p class=\"blocklead\">El <b>DCO (Dynamic Creative Optimization)<\u002Fb> es una tecnología de personalización de anuncios en tiempo real. En lugar de un anuncio único y cerrado, la creatividad se desglosa en <b>elementos individuales<\u002Fb> (imagen, texto, botón de llamada a la acción…).<\u002Fp>\n      <div class=\"callout\" style=\"border-left:3px solid var(--teoria); background:var(--teoria-bg); margin:14px 0;\">\n        <p style=\"margin:0\">Una única <b>plantilla creativa<\u002Fb> puede generar <b>múltiples versiones<\u002Fb> de anuncios según los datos de audiencia.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"evo-eyebrow\" style=\"color:var(--teoria)\">Elementos variables<\u002Fp>\n      <div class=\"evo-chips\" style=\"margin-top:8px;\">\n        <span>Imagen<\u002Fspan><span>Titular<\u002Fspan><span>Texto secundario<\u002Fspan><span>CTA<\u002Fspan><span>Color / fondo<\u002Fspan><span>Producto o sorteo recomendado<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin-top:16px; display:flex; flex-wrap:wrap; gap:10px;\">\n        <a href=\"https://blog.zuuvi.com/dynamic-creative-optimization/3-perfect-dco-ad-examples?utm_source=chatgpt.com#zuuvi\" target=\"_blank\" rel=\"noopener\" onclick=\"window.open(this.href,'_blank','noopener,width=1200,height=800');return false;\" style=\"display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; color:var(--teoria); text-decoration:none; padding:9px 15px; border-radius:999px; border:1px solid #bfdbfe; background:var(--teoria-bg);\">Ver ejemplos de DCO →<\u002Fa>\n        <a href=\"recursos/simulador-dco-oreo-gaming.html\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; color:var(--practica); text-decoration:none; padding:9px 15px; border-radius:999px; border:1px solid #99f6e4; background:var(--practica-bg);\">Simulador DCO · Oreo Gaming →<\u002Fa>\n        <a href=\"recursos/caso-oreo-gaming.html\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; color:var(--reto); text-decoration:none; padding:9px 15px; border-radius:999px; border:1px solid #fcd34d; background:var(--reto-bg);\">Ejercicio · Caso Oreo →<\u002Fa>\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">El coste de un anuncio en compra programática (CPM) viene dictado por el valor que aporta al anunciante. Las razones principales por las que formatos como el Billboard (970x250) o el Half-Page (300x600) alcanzan precios premium son: Visibilidad, engagement y escasez de inventario.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 02<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> que dejen de pensar en banners como piezas sueltas y empiecen a pensar en inventario monetizable.<\u002Fp>\n      <p><b>Pregunta:<\u002Fb> ¿Compraríais un formato grande below the fold antes que uno pequeño muy visible?<\u002Fp>\n      <p><b>Evitar:<\u002Fb> convertir la pantalla en una lista completa de formatos IAB.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s01\">← 01 · Evolución de la compra digital<\u002Fa><a href=\"#s03\">03 · Detectives AdTech →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S03 · Detectives ══════════ -->\n  <section class=\"screen flag\" id=\"s03\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 03 · 30 min<\u002Fp>\n      <h2>03 · Detectives AdTech<\u002Fh2>\n      <p class=\"subtitle\">Vamos a buscar inventario publicitario en webs reales.<\u002Fp>\n      <p class=\"lead\">Antes de abrir DevTools, hay que aprender a observar.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · mirar como publisher e investigador<\u002Fspan><span><b>Tiempo<\u002Fb> · 30 min<\u002Fspan><span><b>Tipo<\u002Fb> · Práctica<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Método en dos pasos -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">El método, en dos pasos<\u002Fp>\n      <div class=\"qcards\" style=\"grid-template-columns:1fr 1fr\">\n        <div class=\"qcard acc-practica\"><div class=\"k\" style=\"color:var(--practica)\">Paso 1<\u002Fdiv><b>Primero observamos<\u002Fb><span>Entrad en una web real y miradla como usuarios. Buscad espacios publicitarios visibles: dónde aparecen, qué formato parecen tener, si están above o below the fold, si interrumpen la lectura y qué valor tienen.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard acc-practica\"><div class=\"k\" style=\"color:var(--practica)\">Paso 2<\u002Fdiv><b>Después buscamos señales<\u002Fb><span>Añadid <code>google_console=1<\u002Fcode> a la URL para pedir a la Google Publisher Console que muestre las pistas técnicas de la página.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Cómo añadir el parámetro -->\n    <div class=\"panel-card acc-practica\" data-reveal=\"\">\n      <p class=\"blocktitle\">Cómo añadir el parámetro<\u002Fp>\n      <div class=\"codegrid\">\n        <code>https://www.ejemplo.com/articulo\n↓\nhttps://www.ejemplo.com/articulo?google_console=1<\u002Fcode>\n        <code>https://www.ejemplo.com/articulo?utm_source=test\n↓\nhttps://www.ejemplo.com/articulo?utm_source=test&amp;google_console=1<\u002Fcode>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Qué puede mostrar -->\n    <div class=\"note-card acc-practica\" data-reveal=\"\" style=\"border-left-color:var(--practica)\">\n      <span class=\"tag tag-practica\">Qué puede mostrar<\u002Fspan>\n      <p>Ad units, slots, sizes, delivery info, targeting o espacios unfilled. La consola no nos da toda la verdad, pero nos da pistas muy valiosas.<\u002Fp>\n    <\u002Fdiv>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 03<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> aprender a mirar una web como publisher, anunciante e investigador.<\u002Fp>\n      <p><b>Reconducir:<\u002Fb> \"No veo anuncio\" puede ser lazy loading, consentimiento, adblocker, inventario no vendido o carga tardía.<\u002Fp>\n      <p><b>Plan B:<\u002Fb> incógnito, aceptar consentimiento, desactivar adblocker, recargar o usar MediaLab/capturas.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s02\">← 02 · Inventario y formatos<\u002Fa><a href=\"#s04\">04 · Inspector AdTech →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S04 · Inspector ══════════ -->\n  <section class=\"screen flag\" id=\"s04\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 04 · 30 min<\u002Fp>\n      <h2>04 · Inspector AdTech<\u002Fh2>\n      <p class=\"subtitle\">Vamos a abrir el capó de un banner.<\u002Fp>\n      <p class=\"lead\">El banner no aparece mágicamente. Hay un hueco, una llamada, una decisión, una creatividad y una medición.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · ver la cadena completa<\u002Fspan><span><b>Tiempo<\u002Fb> · 30 min<\u002Fspan><span><b>Tipo<\u002Fb> · Teoría<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn\" href=\"recursos/inspector-adtech.html\" target=\"_blank\" rel=\"noopener\">Abrir Inspector AdTech<\u002Fa>\n        <a class=\"btn alt\" href=\"recursos/anuncio-en-blanco.html\" target=\"_blank\" rel=\"noopener\">Anuncio en blanco<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- El viaje de una impresión: pasos clicables -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"blocktitle\">El viaje de una impresión · toca cada paso<\u002Fp>\n      <div class=\"journey acc-teoria\" data-journey=\"\">\n        <div class=\"journey-track\" role=\"tablist\" aria-label=\"Pasos de un banner\">\n          <button class=\"journey-node\" type=\"button\" data-step=\"slot\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">Slot<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"adcall\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">Ad call<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"decision\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">Decisión<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"creatividad\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">Creatividad<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"impresion\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">Impresión<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"view\" style=\"--i:5\"><span class=\"jn-dot\">6<\u002Fspan><span class=\"jn-label\">Viewability<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"clic\" style=\"--i:6\"><span class=\"jn-dot\">7<\u002Fspan><span class=\"jn-label\">Clic<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"journey-panels\">\n          <div class=\"journey-panel\" data-panel=\"slot\"><h4>Slot<\u002Fh4><p>El slot es el espacio publicitario reservado dentro de la página. Todavía no es el anuncio: es el hueco donde podría cargarse un anuncio.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"adcall\"><h4>Ad call<\u002Fh4><p>La ad call es la petición que hace la página para solicitar un anuncio. Puede incluir ad unit, tamaño, URL, contexto o parámetros comerciales.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"decision\"><h4>Decisión y medición<\u002Fh4><p>En muchos publishers, Google Ad Manager ayuda a ordenar la decisión entre distintas fuentes de demanda, campañas y reglas. Después se mide impresión, visibilidad, clic y conversión.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"creatividad\"><h4>Creatividad<\u002Fh4><p>La pieza publicitaria que finalmente se carga en el slot. <a href=\"#s10\">Se detalla en la pantalla 10 →<\u002Fa><\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"impresion\"><h4>Impresión<\u002Fh4><p>El anuncio servido y registrado por el sistema. <a href=\"#s10\">Se detalla en la pantalla 10 →<\u002Fa><\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"view\"><h4>Viewability<\u002Fh4><p>¿Tuvo el anuncio una oportunidad real de ser visto? <a href=\"#s10\">Se detalla en la pantalla 10 →<\u002Fa><\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"clic\"><h4>Clic<\u002Fh4><p>La interacción del usuario y la redirección a la landing. <a href=\"#s10\">Se detalla en la pantalla 10 →<\u002Fa><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Evidencia visual + idea clave -->\n    <div class=\"split\" data-reveal=\"\">\n      <div class=\"ph\"><span>[ SCREENSHOT · Google Publisher Console sobre un banner real ]<\u002Fspan><\u002Fdiv>\n      <blockquote class=\"bq-big\">Un banner es solo la parte visible de una cadena de decisiones técnicas, comerciales y de medición.<\u002Fblockquote>\n    <\u002Fdiv>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 04<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> ordenar el recorrido básico antes de entrar en Header Bidding y DevTools real.<\u002Fp>\n      <p><b>Frase:<\u002Fb> \"Si entendéis este flujo, DevTools deja de parecer una lista caótica y empieza a parecer una historia.\"<\u002Fp>\n      <p><b>Evitar:<\u002Fb> prioridades de GAM, line items, forecast o trafficking avanzado.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s03\">← 03 · Detectives AdTech<\u002Fa><a href=\"#s05\">05 · Header Bidding →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S05 · Header Bidding ══════════ -->\n  <section class=\"screen flag\" id=\"s05\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 05 · 30 min<\u002Fp>\n      <h2>05 · Header Bidding<\u002Fh2>\n      <p class=\"subtitle\">Cuando el publisher invita a más compradores a competir por la misma impresión.<\u002Fp>\n      <p class=\"lead\">Header Bidding crea una competición previa entre distintas fuentes de demanda antes de que el ad server tome la decisión final.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · más competencia por la impresión<\u002Fspan><span><b>Tiempo<\u002Fb> · 30 min<\u002Fspan><span><b>Tipo<\u002Fb> · Teoría<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- El problema + flujo clicable -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"blocktitle\">El problema, y cómo lo resuelve · toca cada paso<\u002Fp>\n      <p class=\"blocklead\">Si solo preguntas a una fuente de demanda, puedes vender la impresión, pero quizá no al mejor precio posible.<\u002Fp>\n      <div class=\"journey acc-teoria\" data-journey=\"\">\n        <div class=\"journey-track\">\n          <button class=\"journey-node\" type=\"button\" data-step=\"carga\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">Usuario carga página<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"slot\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">Slot disponible<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"hb\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">HB consulta demanda<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"puja\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">Vuelve mejor puja<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"gam\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">GAM decide<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"journey-panels\">\n          <div class=\"journey-panel\" data-panel=\"carga\"><h4>Usuario carga la página<\u002Fh4><p>Al abrirse la web se disparan las llamadas publicitarias antes de que el ad server tome ninguna decisión.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"slot\"><h4>Slot disponible<\u002Fh4><p>Hay un hueco publicitario listo para recibir demanda desde varias fuentes a la vez.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"hb\"><h4>HB consulta demanda<\u002Fh4><p>Header Bidding lanza una competición previa: pregunta a varias fuentes de demanda simultáneamente.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"puja\"><h4>Vuelve la mejor puja<\u002Fh4><p>Cada fuente responde con su puja; se recoge la mejor de esa competición previa.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"gam\"><h4>GAM decide<\u002Fh4><p>La mejor puja entra en Google Ad Manager, que ordena la decisión final entre todas las fuentes.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- HB vs Open Bidding vs GAM como tabs -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\" data-tabs=\"\">\n      <p class=\"blocktitle\">Header Bidding vs Open Bidding vs GAM<\u002Fp>\n      <div class=\"tabs-nav\">\n        <button class=\"tab-btn active\" type=\"button\" data-tab=\"hb\">Header Bidding<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"ob\">Open Bidding<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"gam\">GAM<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tab-panel active\" data-tab=\"hb\"><p>Competición previa organizada por el publisher, antes de llamar al ad server.<\u002Fp><\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"ob\"><p>Competición integrada dentro del entorno de Google Ad Manager.<\u002Fp><\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"gam\"><p>Sistema que ayuda al publisher a ordenar la decisión final.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Stack -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Stack simplificado · de mayor a menor prioridad<\u002Fp>\n      <div class=\"stack\"><span>Venta directa<\u002Fspan><span>Programática garantizada<\u002Fspan><span>Preferred deals<\u002Fspan><span>Header Bidding<\u002Fspan><span>Open Bidding<\u002Fspan><span>Open auction / backfill<\u002Fspan><span>House ads<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">Header Bidding no sustituye a Google Ad Manager. Aporta competencia.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 05<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> entender HB como respuesta económica y técnica a \"quiero que más compradores compitan por mi inventario\".<\u002Fp>\n      <p><b>Pregunta:<\u002Fb> Si tienes un espacio valioso, ¿lo ofrecerías a un solo comprador o dejarías competir a varios?<\u002Fp>\n      <p><b>Errores:<\u002Fb> HB no es el ad server, no siempre gana y más SSPs no siempre significa más ingresos.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s04\">← 04 · Inspector AdTech<\u002Fa><a href=\"#s06\">06 · DevTools real →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S06 · DevTools ══════════ -->\n  <section class=\"screen flag\" id=\"s06\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 06 · 30 min<\u002Fp>\n      <h2>06 · DevTools real<\u002Fh2>\n      <p class=\"subtitle\">Buscamos señales reales del viaje de una impresión.<\u002Fp>\n      <p class=\"lead\">DevTools no nos da la verdad absoluta. Nos ayuda a construir hipótesis razonables.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · extraer señales sin sobrerreaccionar<\u002Fspan><span><b>Tiempo<\u002Fb> · 30 min<\u002Fspan><span><b>Tipo<\u002Fb> · Práctica<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn alt\" href=\"recursos/chuleta-devtools.html\" target=\"_blank\" rel=\"noopener\">Chuleta DevTools<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Preparación como checklist marcable -->\n    <div class=\"panel-card acc-practica\" data-reveal=\"\">\n      <p class=\"blocktitle\">Preparación · marca cada paso<\u002Fp>\n      <ul class=\"checklist acc-practica\">\n        <li><span class=\"box\">✓<\u002Fspan>Abrid Chrome<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Desactivad adblocker<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Aceptad el consentimiento de cookies<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Abrid DevTools<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Entrad en Network<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Activad Preserve log<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Activad Disable cache<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Recargad<\u002Fli>\n        <li><span class=\"box\">✓<\u002Fspan>Haced scroll lentamente<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- Filtros útiles como chips -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Filtros útiles en Network<\u002Fp>\n      <p class=\"chips\">\n        <span>gampad<\u002Fspan><span>securepubads<\u002Fspan><span>googletag<\u002Fspan><span>doubleclick<\u002Fspan>\n        <span>prebid<\u002Fspan><span>hb_<\u002Fspan><span>pubmatic<\u002Fspan><span>openx<\u002Fspan>\n        <span>xandr<\u002Fspan><span>criteo<\u002Fspan><span>300x250<\u002Fspan><span>300x600<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Qué registrar -->\n    <div class=\"note-card acc-practica\" data-reveal=\"\" style=\"border-left-color:var(--practica)\">\n      <span class=\"tag tag-practica\">Qué registrar<\u002Fspan>\n      <p>Anotad filtro, petición, dominio, parámetro, valor, qué creéis que significa, nivel de certeza, evidencia y qué no podéis confirmar.<\u002Fp>\n      <blockquote>Un buen diagnóstico distingue evidencia, hipótesis y duda.<\u002Fblockquote>\n    <\u002Fdiv>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 06<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> perder el miedo a DevTools y extraer señales útiles sin sobrerreaccionar.<\u002Fp>\n      <p><b>Webs recomendadas:<\u002Fb> Grupo A LetsFamily, Grupo B Xataka, Grupo C Marca o El País.<\u002Fp>\n      <p><b>Plan B:<\u002Fb> si no aparecen anuncios, comprobar consentimiento, adblocker, incógnito, scroll y lazy loading.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s05\">← 05 · Header Bidding<\u002Fa><a href=\"#s07\">07 · Floor, bid shading y GAM →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S07 · Floor & GAM ══════════ -->\n  <section class=\"screen flag\" id=\"s07\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 07 · 30 min<\u002Fp>\n      <h2>07 · Floor, bid shading y GAM simplificado<\u002Fh2>\n      <p class=\"subtitle\">Antes de pujar, conviene conocer las reglas del mercado.<\u002Fp>\n      <p class=\"lead\">El publisher fija un precio mínimo para proteger su inventario y el comprador afina cuánto está dispuesto a pagar. Entender esto primero hace que la subasta se vea con otros ojos.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · sentar la capa económica<\u002Fspan><span><b>Tiempo<\u002Fb> · 30 min<\u002Fspan><span><b>Tipo<\u002Fb> · Teoría<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn\" href=\"recursos/cpm-benchmarks-simulacion-rtb.html\" target=\"_blank\" rel=\"noopener\">Benchmarks CPM<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tres conceptos como tarjetas -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Tres piezas de la estrategia <span style=\"font-weight:600;color:var(--muted);font-size:13px;\">· toca cada tarjeta para ver un ejemplo<\u002Fspan><\u002Fp>\n      <div class=\"qcards\" style=\"grid-template-columns:repeat(3,1fr)\">\n        <button type=\"button\" class=\"qcard qcard-ex\" data-expand=\"\">\n          <div class=\"k\">01<\u002Fdiv><b>Floor price<\u002Fb>\n          <span>Precio mínimo que el publisher exige para vender una impresión.<\u002Fspan>\n          <div class=\"qcard-ex-body\">Ejemplo: si el floor es 1,20 €, una puja de 0,90 € queda fuera.<\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" class=\"qcard qcard-ex\" data-expand=\"\">\n          <div class=\"k\">02<\u002Fdiv><b>Bid shading<\u002Fb>\n          <span>Ajuste de puja por debajo de su CPM máximo rentable.<\u002Fspan>\n          <div class=\"qcard-ex-body\">Ejemplo: el DSP puede pagar 3 €, pero puja 2,20 € porque estima que basta para ganar.<\u002Fdiv>\n        <\u002Fbutton>\n        <button type=\"button\" class=\"qcard qcard-ex\" data-expand=\"\">\n          <div class=\"k\">03<\u002Fdiv><b>GAM<\u002Fb>\n          <span>Ad server que organiza inventario, campañas, reglas y demanda.<\u002Fspan>\n          <div class=\"qcard-ex-body\">Ejemplo: decide si el banner lo sirve una campaña directa, AdX u Open Bidding.<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Primer vs segundo precio -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Cómo se paga: primer vs segundo precio<\u002Fp>\n      <div class=\"qcards\" style=\"grid-template-columns:repeat(2,1fr)\">\n        <div class=\"qcard\">\n          <div class=\"k\">2º<\u002Fdiv>\n          <b>Segundo precio<\u002Fb>\n          <span>Gana la puja más alta, pero paga la <b>segunda puja válida<\u002Fb>.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"qcard\">\n          <div class=\"k\">1º<\u002Fdiv>\n          <b>Primer precio<\u002Fb>\n          <span>Gana la puja más alta y paga <b>exactamente lo que ha pujado<\u002Fb>.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Detalle en pestañas -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\" data-tabs=\"\">\n      <p class=\"blocktitle\">En detalle<\u002Fp>\n      <div class=\"tabs-nav\">\n        <button class=\"tab-btn active\" type=\"button\" data-tab=\"floor\">Floor price<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"shading\">Bid shading<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"gam\">GAM simplificado<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"yield\">Yield manager<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tab-panel active\" data-tab=\"floor\"><p>Si ninguna puja supera el mínimo, la impresión puede quedar sin vender. Un floor alto protege el valor, pero si es demasiado alto puede matar la demanda.<\u002Fp><\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"shading\"><p>En primer precio, el ganador paga lo que puja. Por eso los compradores ajustan sus pujas para no sobrepagar.<\u002Fp><\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"gam\"><p>La puja programática no vive sola. El publisher puede tener directa, acuerdos preferentes, programática garantizada, open auction, backfill o house ads.<\u002Fp><\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"yield\"><p>Optimiza ingresos, demanda, fill rate, viewability, formatos, experiencia de usuario y acuerdos comerciales.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">La monetización no consiste en vender siempre al precio más alto. Consiste en encontrar equilibrio.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 07<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> sentar la capa económica antes de pujar: floors, bid shading, GAM y rol del yield manager.<\u002Fp>\n      <p><b>Usar rondas:<\u002Fb> 3 floor price, 4 bid shading, 5 GAM simplificado. Solo celdas verdes.<\u002Fp>\n      <p><b>Frase:<\u002Fb> \"El precio no es un número aislado: es estrategia del publisher, comprador y entrega.\"<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s06\">← 06 · DevTools real<\u002Fa><a href=\"#s08\">08 · Subasta RTB →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S08 · Subasta RTB ══════════ -->\n  <section class=\"screen flag\" id=\"s08\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 08 · 15 min<\u002Fp>\n      <h2>08 · Subasta RTB<\u002Fh2>\n      <p class=\"subtitle\">Ahora dejamos de observar y empezamos a pujar.<\u002Fp>\n      <p class=\"lead\">En RTB no compras un banner. Compras una oportunidad concreta de impactar a un usuario concreto en un contexto concreto.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · pujar bien, no alto<\u002Fspan><span><b>Tiempo<\u002Fb> · 15 min<\u002Fspan><span><b>Tipo<\u002Fb> · Reto<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn\" href=\"recursos/simulador-subasta-rtb.html\" target=\"_blank\" rel=\"noopener\">Simulador · Subasta RTB<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Escenario como dossier -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">El escenario de puja<\u002Fp>\n      <div class=\"dossier\">\n        <div class=\"df\"><b>Publisher<\u002Fb><span>IGN España · gaming<\u002Fspan><\u002Fdiv>\n        <div class=\"df\"><b>Contexto<\u002Fb><span>Review de un juego Xbox<\u002Fspan><\u002Fdiv>\n        <div class=\"df\"><b>Formato<\u002Fb><span>300×250<\u002Fspan><\u002Fdiv>\n        <div class=\"df\"><b>Posición<\u002Fb><span>Above the fold<\u002Fspan><\u002Fdiv>\n        <div class=\"df\"><b>Usuario<\u002Fb><span>Gamer con alta afinidad Xbox<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Las dos rondas como pestañas -->\n    <div class=\"panel-card acc-reto\" data-reveal=\"\" data-tabs=\"\">\n      <p class=\"blocktitle\">Las dos rondas<\u002Fp>\n      <div class=\"tabs-nav\">\n        <button class=\"tab-btn active\" type=\"button\" data-tab=\"r1\">Ronda 1 · Segundo precio<\u002Fbutton>\n        <button class=\"tab-btn\" type=\"button\" data-tab=\"r2\">Ronda 2 · Primer precio<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tab-panel active\" data-tab=\"r1\">\n        <p>Gana la puja más alta, pero el ganador paga la segunda mejor puja.<\u002Fp>\n        <div class=\"vs\">\n          <div><b>Quién gana<\u002Fb>La puja más alta<\u002Fdiv>\n          <div><b>Cuánto paga<\u002Fb>La 2ª mejor puja<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tab-panel\" data-tab=\"r2\">\n        <p>Gana la puja más alta y paga exactamente lo que ha pujado.<\u002Fp>\n        <div class=\"vs\">\n          <div><b>Quién gana<\u002Fb>La puja más alta<\u002Fdiv>\n          <div><b>Cuánto paga<\u002Fb>Justo lo que pujó<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">La misión no es pujar siempre más alto. La misión es comprar bien.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 08<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> que entiendan que el modelo de precio cambia el comportamiento del comprador.<\u002Fp>\n      <p><b>Frase:<\u002Fb> \"Ganar una impresión no significa haber comprado bien.\"<\u002Fp>\n      <p><b>No tocar aún:<\u002Fb> floor price, bid shading, Last Look, GAM avanzado.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s07\">← 07 · Floor, bid shading y GAM<\u002Fa><a href=\"#s09\">09 · Caso Last Look →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S09 · Last Look ══════════ -->\n  <section class=\"screen flag\" id=\"s09\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 09 · 10 min<\u002Fp>\n      <h2>09 · Caso Last Look<\u002Fh2>\n      <p class=\"subtitle\">Cuando saber el precio a batir cambiaba toda la subasta.<\u002Fp>\n      <p class=\"lead\">No solo importa quién gana una subasta. También importa qué información tiene cada participante antes de pujar.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · por qué importa el diseño de la subasta<\u002Fspan><span><b>Tiempo<\u002Fb> · 10 min<\u002Fspan><span><b>Tipo<\u002Fb> · Caso<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn\" href=\"recursos/last-look-google.html\" target=\"_blank\" rel=\"noopener\">Abrir caso Last Look<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- El caso, paso a paso -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"blocktitle\">El caso · toca cada paso<\u002Fp>\n      <p class=\"blocklead\">Una impresión sale al mercado. Por un lado compiten varias fuentes mediante Header Bidding; por otro, Google AdX también puede competir.<\u002Fp>\n      <div class=\"journey acc-teoria\" data-journey=\"\">\n        <div class=\"journey-track\">\n          <button class=\"journey-node\" type=\"button\" data-step=\"hb\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">HB genera una puja<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"gam\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">La puja llega a GAM<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"adx\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">AdX conoce el precio a superar<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"compite\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">AdX compite con esa info<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"impacto\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">Impacto en el publisher<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"journey-panels\">\n          <div class=\"journey-panel\" data-panel=\"hb\"><h4>Header Bidding genera una puja<\u002Fh4><p>Las fuentes de demanda compiten en la competición previa y devuelven su mejor puja.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"gam\"><h4>La puja llega a GAM<\u002Fh4><p>Esa mejor puja entra en Google Ad Manager para la decisión final.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"adx\"><h4>AdX conoce el precio a superar<\u002Fh4><p>Google AdX podía ver el precio que debía batir antes de decidir su propia puja.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"compite\"><h4>AdX compite con esa información<\u002Fh4><p>Con esa ventaja de información, AdX ajustaba su puja sabiendo exactamente qué necesitaba para ganar.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"impacto\"><h4>Impacto en el publisher<\u002Fh4><p>El diseño de la subasta generaba una ventaja estructural de información que afectaba al resultado.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Preguntas del caso como tarjetas -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Preguntas durante el caso<\u002Fp>\n      <div class=\"qcards\">\n        <div class=\"qcard\"><div class=\"k\">01<\u002Fdiv><b>¿Quién sabe qué?<\u002Fb><span>Identifica la información de cada participante.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">02<\u002Fdiv><b>¿Cuándo lo sabe?<\u002Fb><span>El momento en que llega esa información.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">03<\u002Fdiv><b>¿Qué ventaja le da?<\u002Fb><span>Cómo cambia su decisión de puja.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">04<\u002Fdiv><b>¿Qué impacto tiene?<\u002Fb><span>Consecuencias para el publisher.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"callout\" data-reveal=\"\">\n      <p class=\"blocktitle\" style=\"color:var(--reto)\">Cuidado con la interpretación<\u002Fp>\n      <p>No nos quedamos con \"Google hacía trampas\". Nos quedamos con una idea más profesional: el diseño de la subasta generaba una <b>ventaja estructural de información<\u002Fb>.<\u002Fp>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">En una subasta, la información puede valer tanto como la puja.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 09<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> entender por qué el diseño de la subasta importa.<\u002Fp>\n      <p><b>Decir:<\u002Fb> ventaja estructural de información / asimetría de información.<\u002Fp>\n      <p><b>Evitar:<\u002Fb> \"Google robaba al publisher\" o \"first price solucionó todos los problemas\".<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s08\">← 08 · Subasta RTB<\u002Fa><a href=\"#s10\">10 · Creatividad e impresión →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S10 · Viewability ══════════ -->\n  <section class=\"screen flag\" id=\"s10\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 10 · 15 min<\u002Fp>\n      <h2>10 · Creatividad, impresión, viewability y clic<\u002Fh2>\n      <p class=\"subtitle\">Ganar la subasta solo es el principio de la medición.<\u002Fp>\n      <p class=\"lead\">Ganar la subasta no significa que la campaña haya funcionado. Solo significa que tienes derecho a servir una creatividad.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · no confundir servido, visto, clic y conversión<\u002Fspan><span><b>Tiempo<\u002Fb> · 15 min<\u002Fspan><span><b>Tipo<\u002Fb> · Teoría<\u002Fspan><\u002Fdiv>\n      <div class=\"actions\">\n        <a class=\"btn\" href=\"recursos/inspector-adtech.html\" target=\"_blank\" rel=\"noopener\">Volver al Inspector<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- La cadena de medición, clicable -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"blocktitle\">Después de ganar la subasta · toca cada paso<\u002Fp>\n      <div class=\"journey acc-teoria\" data-journey=\"\">\n        <div class=\"journey-track\">\n          <button class=\"journey-node\" type=\"button\" data-step=\"crea\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">Creatividad<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"imp\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">Impresión servida<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"view\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">Viewability<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"clic\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">Clic<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"land\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">Landing<\u002Fspan><\u002Fbutton>\n          <button class=\"journey-node\" type=\"button\" data-step=\"conv\" style=\"--i:5\"><span class=\"jn-dot\">6<\u002Fspan><span class=\"jn-label\">Conversión<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"journey-panels\">\n          <div class=\"journey-panel\" data-panel=\"crea\"><h4>Creatividad<\u002Fh4><p>Es la pieza publicitaria que aparece: imagen, HTML5, vídeo, rich media, native o combinación de assets y trackers.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"imp\"><h4>Impresión servida ≠ vista<\u002Fh4><p>Una impresión servida significa que el anuncio se ha entregado y registrado, pero no garantiza que el usuario lo haya visto.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"view\"><h4>Viewability<\u002Fh4><p>Intenta responder a una pregunta: ¿el anuncio tuvo una oportunidad real de ser visto?<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"clic\"><h4>Clic<\u002Fh4><p>El clic registra interacción y redirección a landing, pero no siempre termina en conversión útil.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"land\"><h4>Landing<\u002Fh4><p>La página de destino a la que llega el usuario tras el clic. Aquí empieza a jugarse la conversión real.<\u002Fp><\u002Fdiv>\n          <div class=\"journey-panel\" data-panel=\"conv\"><h4>Conversión<\u002Fh4><p>El objetivo útil de la campaña. Ni la impresión ni el clic la garantizan por sí solos.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"split\" data-reveal=\"\">\n      <div class=\"ph\"><span>[ SCREENSHOT · creatividad servida + medición de viewability ]<\u002Fspan><\u002Fdiv>\n      <blockquote class=\"bq-big\">Servido no significa visto. Visto no significa clicado. Clicado no significa convertido.<\u002Fblockquote>\n    <\u002Fdiv>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 10<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> evitar la confusión entre impresión servida, vista, clic y conversión.<\u002Fp>\n      <p><b>Actividad rápida:<\u002Fb> ordenar Slot → Subasta → Creatividad → Impresión servida → Viewability → Clic → Landing.<\u002Fp>\n      <p><b>Errores:<\u002Fb> impresión = vista, clic = conversión, ganar subasta = campaña funciona.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s09\">← 09 · Caso Last Look<\u002Fa><a href=\"#s11\">11 · Cierre sesión 1 →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S11 · Cierre ══════════ -->\n  <section class=\"screen flag\" id=\"s11\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 11 · 5–10 min<\u002Fp>\n      <h2>11 · Cierre sesión 1<\u002Fh2>\n      <p class=\"subtitle\">Ya sabemos seguir el viaje de una impresión. El sábado aprenderemos a gestionarla.<\u002Fp>\n      <p class=\"lead\">Esta pantalla es un checkpoint, no el final del curso.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · progreso, no saturación<\u002Fspan><span><b>Tiempo<\u002Fb> · 5–10 min<\u002Fspan><span><b>Tipo<\u002Fb> · Resumen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- El viaje completo reconstruido -->\n    <div class=\"thread-wrap\" data-reveal=\"\">\n      <p class=\"blocktitle\">Reconstruimos el viaje completo<\u002Fp>\n      <div class=\"journey acc-red is-in\" data-journey=\"\" data-static=\"\">\n        <div class=\"journey-track\">\n          <div class=\"journey-node done\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">Inventario<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">Slot<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">Ad call<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">HB / Open Bidding<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">GAM<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:5\"><span class=\"jn-dot\">6<\u002Fspan><span class=\"jn-label\">Subasta<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:6\"><span class=\"jn-dot\">7<\u002Fspan><span class=\"jn-label\">Floor / Bid shading<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:7\"><span class=\"jn-dot\">8<\u002Fspan><span class=\"jn-label\">Creatividad<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:8\"><span class=\"jn-dot\">9<\u002Fspan><span class=\"jn-label\">Impresión<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:9\"><span class=\"jn-dot\">10<\u002Fspan><span class=\"jn-label\">Viewability<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:10\"><span class=\"jn-dot\">11<\u002Fspan><span class=\"jn-label\">Clic<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:11\"><span class=\"jn-dot\">12<\u002Fspan><span class=\"jn-label\">Conversión<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Mañana sábado como tarjetas -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Mañana, sábado<\u002Fp>\n      <div class=\"qcards\">\n        <div class=\"qcard\"><div class=\"k\">01<\u002Fdiv><b>Inventario<\u002Fb><span>Cómo se organiza.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">02<\u002Fdiv><b>Google Ad Manager<\u002Fb><span>Cómo se configura.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">03<\u002Fdiv><b>Campañas<\u002Fb><span>Cómo se priorizan.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">04<\u002Fdiv><b>Tags<\u002Fb><span>Cómo se usan.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">05<\u002Fdiv><b>Espacios vacíos<\u002Fb><span>Cómo se evita dejarlos.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">06<\u002Fdiv><b>Yield manager<\u002Fb><span>Cómo piensa.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote data-reveal=\"\">Hoy hemos seguido la impresión. El sábado vamos a aprender a gestionarla.<\u002Fblockquote>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 11<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> cerrar con sensación de progreso, no de saturación.<\u002Fp>\n      <p><b>Guion:<\u002Fb> \"Hoy no quería que memorizarais siglas. Quería que entendierais el viaje.\"<\u002Fp>\n      <p><b>Evitar:<\u002Fb> añadir teoría nueva o resolver todas las dudas técnicas. Aparcar lo que encaje con sábado.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><a href=\"#s10\">← 10 · Creatividad, impresión, viewability y clic<\
