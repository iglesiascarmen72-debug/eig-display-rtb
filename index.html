  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"fdab97ec-2475-45a2-b34f-acc28a01d903\") format('woff2');\n  unicode-range: U+1F00-1FFF;\n}\n/* greek */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"00d7c3a5-bb94-4ecf-be65-4d064fefbd9c\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"2c690d0f-9e8e-4677-ad49-d6992b0216d1\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"fb01c253-876c-4627-971d-9c4253297ef0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"f4b72d79-08bd-47f9-a7cb-1f47dfb90174\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Paleta institucional ESIC */\n  --navy:       #0D1F3C;\n  --navy-dark:  #08132A;\n  --navy-mid:   #1A3058;\n  --esic-red:   #C8102E;\n  --esic-red-light: #f9e0e5;\n  --slate:      #2B3A55;\n  --silver:     #F2F4F7;\n  --white:      #ffffff;\n\n  /* Acento S1 (rojo ESIC) */\n  --accent:     #C8102E;\n  --accent-soft:#f9e0e5;\n\n  /* Semántica de bloques */\n  --teoria:     #1d4ed8;\n  --teoria-bg:  #eff6ff;\n  --practica:   #0f766e;\n  --practica-bg:#f0fdfa;\n  --reto:       #b45309;\n  --reto-bg:    #fffbeb;\n  --recurso:    #6d28d9;\n  --recurso-bg: #f5f3ff;\n\n  /* Texto */\n  --ink:        #0f172a;\n  --ink-mid:    #374151;\n  --muted:      #64748b;\n  --line:       #e2e8f0;\n\n  /* Sombras */\n  --shadow-sm:  0 2px 8px rgba(13,31,60,.08);\n  --shadow:     0 8px 28px rgba(13,31,60,.12);\n  --shadow-lg:  0 20px 60px rgba(13,31,60,.16);\n\n  /* Radios */\n  --r-sm: 10px;\n  --r:    18px;\n  --r-lg: 24px;\n\n  /* Tipo */\n  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;\n  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;\n}\n\n/* ─── Reset ─────────────────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  font-family: var(--font);\n  font-size: 15px;\n  line-height: 1.6;\n  color: var(--ink);\n  background: #eef2f8;\n}\na { color: inherit; }\ncode {\n  font-family: var(--mono);\n  font-size: .88em;\n  background: #eef4fb;\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  padding: .1em .35em;\n}\n\n/* ─── Layout principal ───────────────────────────────────── */\n.layout {\n  display: grid;\n  grid-template-columns: 288px 1fr;\n  min-height: 100vh;\n}\n\n/* ─── Sidebar ────────────────────────────────────────────── */\n.sidebar {\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  background: var(--navy-dark);\n  color: white;\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n.sidebar-inner {\n  overflow-y: auto;\n  flex: 1;\n  padding: 20px 16px 24px;\n}\n\n/* Brand */\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 20px;\n  padding-bottom: 18px;\n  border-bottom: 1px solid rgba(255,255,255,.1);\n}\n.brand-logo {\n  height: 28px;\n  filter: brightness(0) invert(1);\n  opacity: .95;\n}\n.brand-info { flex: 1; min-width: 0; }\n.brand-info h1 {\n  font-size: 13px;\n  font-weight: 800;\n  line-height: 1.2;\n  margin: 0;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.brand-info p {\n  font-size: 11px;\n  color: #94a3b8;\n  margin: 3px 0 0;\n}\n\n/* Session badge */\n.session-badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  background: rgba(200,16,46,.22);\n  border: 1px solid rgba(200,16,46,.4);\n  color: #fca5a5;\n  font-size: 11px;\n  font-weight: 800;\n  letter-spacing: .07em;\n  text-transform: uppercase;\n  border-radius: 999px;\n  padding: 5px 10px;\n  margin-bottom: 16px;\n}\n.session-badge .dot {\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--esic-red);\n}\n\n/* Mode pill */\n.mode-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 5px 10px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 700;\n  margin-bottom: 16px;\n}\n.mode-pill.alumno { background: rgba(255,255,255,.1); color: #cbd5e1; }\n.mode-pill.profesor { background: rgba(200,16,46,.2); color: #fca5a5; border: 1px solid rgba(200,16,46,.35); }\n.mode-pill svg { width: 13px; height: 13px; }\n\n/* Nav */\n.nav {\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n}\n.nav a {\n  text-decoration: none;\n  display: grid;\n  grid-template-columns: 32px 1fr;\n  gap: 9px;\n  align-items: center;\n  padding: 9px 10px;\n  border-radius: 12px;\n  color: #94a3b8;\n  font-size: 12.5px;\n  transition: background .15s, color .15s;\n}\n.nav a:hover { background: rgba(255,255,255,.07); color: #e2e8f0; }\n.nav a.active { background: rgba(200,16,46,.2); color: white; border: 1px solid rgba(200,16,46,.3); }\n.nav a .num {\n  background: rgba(255,255,255,.1);\n  border-radius: 8px;\n  text-align: center;\n  padding: 4px 0;\n  font-weight: 900;\n  font-size: 11px;\n}\n.nav a.active .num { background: var(--esic-red); }\n\n/* Side actions */\n.side-actions {\n  padding: 14px 16px;\n  border-top: 1px solid rgba(255,255,255,.08);\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n.side-actions a {\n  font-size: 11.5px;\n  text-decoration: none;\n  border: 1px solid rgba(255,255,255,.13);\n  border-radius: 10px;\n  padding: 9px 12px;\n  color: #94a3b8;\n  transition: color .15s, border-color .15s;\n}\n.side-actions a:hover { color: white; border-color: rgba(255,255,255,.28); }\n\n/* ─── Main content ───────────────────────────────────────── */\n.main {\n  padding: 28px 36px 72px;\n  max-width: 1200px;\n}\n\n/* Topbar */\n.topbar {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  gap: 20px;\n  margin-bottom: 32px;\n}\n.topbar-info h1 {\n  font-size: 30px;\n  font-weight: 900;\n  letter-spacing: -.03em;\n  margin: 0 0 4px;\n  color: var(--navy);\n}\n.topbar-info p { color: var(--muted); margin: 0; font-size: 14px; }\n\n/* ─── Screen sections ────────────────────────────────────── */\n.screen {\n  padding: 0 0 56px;\n  border-top: 1px solid var(--line);\n  scroll-margin-top: 24px;\n}\n.screen:first-of-type { border-top: 0; }\n\n/* Screen header */\n.screen-head {\n  background: white;\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow);\n  padding: 28px 32px;\n  margin-bottom: 18px;\n  position: relative;\n  overflow: hidden;\n}\n.screen-head::before {\n  content: '';\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 4px;\n  background: linear-gradient(90deg, var(--esic-red), #e05577);\n}\n\n.eyebrow {\n  text-transform: uppercase;\n  letter-spacing: .12em;\n  color: var(--esic-red);\n  font-size: 11px;\n  font-weight: 800;\n  margin: 0 0 10px;\n}\n.screen-head h2 {\n  font-size: 32px;\n  font-weight: 900;\n  letter-spacing: -.035em;\n  margin: 0 0 8px;\n  color: var(--navy);\n}\n.subtitle {\n  font-size: 17px;\n  margin: 0 0 8px;\n  color: var(--slate);\n  font-weight: 600;\n}\n.lead {\n  font-size: 15px;\n  color: var(--muted);\n  max-width: 860px;\n  margin: 0;\n}\n\n/* Actions row */\n.actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 9px;\n  margin-top: 18px;\n}\n\n/* Buttons */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  text-decoration: none;\n  font-family: var(--font);\n  font-weight: 700;\n  font-size: 13px;\n  border-radius: 999px;\n  padding: 9px 16px;\n  transition: transform .15s, box-shadow .15s;\n  cursor: pointer;\n  border: none;\n}\n.btn:hover { transform: translateY(-1px); }\n.btn-primary {\n  background: var(--navy);\n  color: white;\n  box-shadow: 0 6px 18px rgba(13,31,60,.22);\n}\n.btn-primary:hover { box-shadow: 0 10px 28px rgba(13,31,60,.28); }\n.btn-red {\n  background: var(--esic-red);\n  color: white;\n  box-shadow: 0 6px 18px rgba(200,16,46,.28);\n}\n.btn-outline {\n  background: white;\n  color: var(--navy);\n  border: 1px solid var(--line);\n}\n.btn { background: var(--navy); color: white; }\n.btn.alt { background: white; color: var(--navy); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }\n\n/* ─── Content grid ───────────────────────────────────────── */\n.content-grid {\n  display: grid;\n  grid-template-columns: minmax(0,1fr) 340px;\n  gap: 18px;\n}\n\n/* Cards */\n.student-card, .teacher-card {\n  background: white;\n  border: 1px solid var(--line);\n  border-radius: var(--r);\n  box-shadow: var(--shadow-sm);\n  padding: 26px;\n}\n.student-card { border-left: 4px solid var(--teoria); }\n.teacher-card {\n  background: #fdfbf7;\n  border-color: #f1e0b8;\n  border-left: 4px solid var(--reto);\n}\n.student-card h3, .teacher-card h3 {\n  margin: 0 0 10px;\n  color: var(--navy);\n  font-size: 15px;\n  font-weight: 800;\n}\n\n/* ─── Block type labels ──────────────────────────────────── */\n.tag {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-size: 10px;\n  font-weight: 800;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  border-radius: 999px;\n  padding: 3px 9px;\n  margin-bottom: 10px;\n}\n.tag-teoria  { background: var(--teoria-bg);   color: var(--teoria);   border: 1px solid #bfdbfe; }\n.tag-practica{ background: var(--practica-bg); color: var(--practica); border: 1px solid #99f6e4; }\n.tag-reto    { background: var(--reto-bg);     color: var(--reto);     border: 1px solid #fcd34d; }\n.tag-recurso { background: var(--recurso-bg);  color: var(--recurso);  border: 1px solid #ddd6fe; }\n\n/* ─── Content components ─────────────────────────────────── */\n.grid { display: grid; gap: 12px; }\n.grid.four  { grid-template-columns: repeat(4,1fr); }\n.grid.three { grid-template-columns: repeat(3,1fr); }\n\n.grid article, .roles div, .compare > div, .case-card {\n  border: 1px solid var(--line);\n  border-radius: 14px;\n  padding: 15px;\n  background: var(--silver);\n}\n.grid article strong, .roles b { display: block; margin-bottom: 5px; font-size: 13px; color: var(--navy); }\n.grid article span, .roles span { color: var(--muted); font-size: 13px; }\n\n.roles { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }\n\n/* Flows */\n.flow, .big-flow, .stack {\n  display: flex;\n  gap: 8px;\n  flex-wrap: wrap;\n  align-items: center;\n  margin: 16px 0;\n}\n.flow span, .big-flow span, .stack span {\n  padding: 9px 13px;\n  border-radius: 999px;\n  background: var(--teoria-bg);\n  border: 1px solid #bfdbfe;\n  font-weight: 700;\n  font-size: 12.5px;\n  color: var(--teoria);\n}\n.flow span:not(:last-child)::after,\n.big-flow span:not(:last-child)::after {\n  content: '→';\n  margin-left: 9px;\n  color: var(--muted);\n}\n.big-flow.full span { border-radius: 12px; }\n\n/* Compare */\n.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n\n/* Tables */\n.table-wrap {\n  overflow: auto;\n  border-radius: 14px;\n  border: 1px solid var(--line);\n  margin: 14px 0;\n}\ntable { width: 100%; border-collapse: collapse; background: white; }\nth, td {\n  padding: 11px 14px;\n  border-bottom: 1px solid var(--line);\n  text-align: left;\n  vertical-align: top;\n  font-size: 13.5px;\n}\nth {\n  background: var(--navy);\n  color: white;\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: .06em;\n}\n\n/* Blockquote */\nblockquote {\n  border-left: 4px solid var(--esic-red);\n  background: var(--esic-red-light);\n  padding: 14px 18px;\n  margin: 20px 0 0;\n  border-radius: 0 14px 14px 0;\n  font-weight: 700;\n  font-size: 14px;\n  color: #7f0e1e;\n}\n\n/* Image card */\n.image-card {\n  border: 1px solid var(--line);\n  border-radius: var(--r);\n  overflow: hidden;\n  background: white;\n  margin-bottom: 18px;\n}\n.image-card img { display: block; max-width: 100%; height: auto; }\n\n/* Code grid */\n.codegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }\n.codegrid code {\n  display: block;\n  white-space: pre-wrap;\n  padding: 14px;\n  background: var(--navy-dark);\n  color: #93c5fd;\n  border: none;\n  font-size: 12px;\n  line-height: 1.7;\n}\n\n/* Steps */\n.steps { columns: 2; }\n\n/* Chips */\n.chips { display: flex; flex-wrap: wrap; gap: 7px; }\n.chips span {\n  background: var(--silver);\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  padding: 5px 10px;\n  font-weight: 700;\n  font-size: 12px;\n}\n\n/* Warning */\n.warning {\n  background: #fffbeb;\n  border: 1px solid #fcd34d;\n  border-radius: 14px;\n  padding: 14px 16px;\n  margin: 14px 0;\n  font-size: 13.5px;\n}\n\n/* Pager */\n.pager {\n  display: flex;\n  justify-content: space-between;\n  gap: 14px;\n  margin-top: 20px;\n  padding-top: 18px;\n  border-top: 1px solid var(--line);\n}\n.pager a {\n  text-decoration: none;\n  background: white;\n  border: 1px solid var(--line);\n  border-radius: 999px;\n  padding: 9px 16px;\n  font-weight: 700;\n  font-size: 13px;\n  color: var(--navy);\n  transition: box-shadow .15s, transform .15s;\n}\n.pager a:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }\n\n/* ─── Login overlay ──────────────────────────────────────── */\n.overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(8,19,42,.94);\n  display: none;\n  z-index: 100;\n  place-items: center;\n  padding: 20px;\n}\n.overlay.show { display: grid; }\n.login {\n  background: white;\n  border-radius: var(--r-lg);\n  padding: 32px;\n  max-width: 420px;\n  width: 100%;\n  box-shadow: var(--shadow-lg);\n}\n.login-logo { height: 32px; margin-bottom: 20px; }\n.login h2 { margin: 0 0 8px; color: var(--navy); font-size: 22px; }\n.login p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }\n.login input {\n  width: 100%;\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  padding: 12px 14px;\n  margin: 8px 0;\n  font-size: 15px;\n  font-family: var(--font);\n  outline: none;\n  transition: border-color .15s;\n}\n.login input:focus { border-color: var(--esic-red); }\n.login button {\n  width: 100%;\n  border: none;\n  cursor: pointer;\n  background: var(--navy);\n  color: white;\n  border-radius: 999px;\n  padding: 12px;\n  font-size: 15px;\n  font-weight: 800;\n  font-family: var(--font);\n  margin-top: 12px;\n}\n.login button:hover { background: var(--navy-mid); }\n.login .err { color: var(--esic-red); font-size: 13px; min-height: 20px; margin-top: 6px; }\n\n/* ─── Intro / landing screen ─────────────────────────────── */\n.screen-head.hero-head {\n  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);\n  color: white;\n}\n.screen-head.hero-head::before { background: linear-gradient(90deg, var(--esic-red), #f97316); }\n.screen-head.hero-head .eyebrow { color: #fca5a5; }\n.screen-head.hero-head h2 { color: white; font-size: 38px; }\n.screen-head.hero-head .subtitle { color: #cbd5e1; }\n.screen-head.hero-head .lead { color: #94a3b8; }\n.screen-head.hero-head .btn { background: white; color: var(--navy); }\n.screen-head.hero-head .btn.alt { background: rgba(255,255,255,.12); color: white; border-color: rgba(255,255,255,.25); }\n\n/* ─── Session continuity banner (S2 recap) ───────────────── */\n.recap-banner {\n  background: linear-gradient(135deg, #0f172a, #1e3a5f);\n  color: white;\n  border-radius: var(--r);\n  padding: 20px 24px;\n  margin-bottom: 20px;\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  border: 1px solid rgba(200,16,46,.35);\n}\n.recap-icon {\n  width: 44px; height: 44px;\n  border-radius: 12px;\n  background: var(--esic-red);\n  display: grid;\n  place-items: center;\n  font-size: 20px;\n  flex-shrink: 0;\n}\n.recap-text b { display: block; font-size: 14px; color: #fca5a5; font-weight: 800; }\n.recap-text p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; line-height: 1.45; }\n\n/* ─── Responsive ─────────────────────────────────────────── */\n@media (max-width: 1100px) {\n  .layout { grid-template-columns: 1fr; }\n  .sidebar { position: relative; height: auto; }\n  .nav { display: grid; grid-template-columns: repeat(2,1fr); }\n  .main { padding: 22px 20px 60px; }\n  .content-grid { grid-template-columns: 1fr; }\n  .grid.four, .roles { grid-template-columns: repeat(2,1fr); }\n}\n\n@media (max-width: 700px) {\n  .topbar { display: block; }\n  .topbar-info h1 { font-size: 24px; }\n  .screen-head h2 { font-size: 26px; }\n  .grid.four, .grid.three, .roles, .compare, .codegrid { grid-template-columns: 1fr; }\n  .steps { columns: 1; }\n  .nav { grid-template-columns: 1fr; }\n  .main { padding: 16px; }\n  .screen-head, .student-card, .teacher-card { padding: 18px 20px; }\n  .pager { flex-direction: column; }\n  .content-grid { gap: 12px; }\n}\n\n\n/* Screen-by-screen navigation, matching S2 */\n.screen { display: none; }\n.screen.active { display: block; }\n.pager a {\n  min-width: 132px;\n  text-align: center;\n}\n\n/* Session 01 dynamic blocks */\n#s01 .content-grid { grid-template-columns: 1fr; }\n#s02 .content-grid { grid-template-columns: 1fr; }\n.session01-card { border-left-color: var(--esic-red); }\n.accordion-stack {\n  display: grid;\n  gap: 16px;\n}\n.dynamic-block {\n  border: 1px solid var(--line);\n  border-radius: var(--r);\n  background: #fbfcfe;\n  overflow: hidden;\n}\n.dynamic-head {\n  display: flex;\n  align-items: flex-start;\n  justify-content: space-between;\n  gap: 16px;\n  padding: 18px;\n}\n.dynamic-head h3 {\n  margin: 8px 0 0;\n  font-size: 24px;\n  line-height: 1.15;\n  letter-spacing: 0;\n}\n.dynamic-kicker {\n  display: inline-flex;\n  border-radius: 999px;\n  background: #e8eef7;\n  color: var(--navy);\n  padding: 5px 11px;\n  font-size: 11px;\n  font-weight: 900;\n}\n.dynamic-toggle {\n  flex: 0 0 auto;\n  min-width: 92px;\n}\n.dynamic-panel {\n  border-top: 1px solid var(--line);\n  padding: 18px;\n}\n.dynamic-question {\n  margin: 0 0 14px;\n  color: var(--muted);\n  font-size: 16px;\n}\n.dark-board {\n  background: linear-gradient(135deg, var(--navy-mid), #174e50);\n  border-radius: 8px;\n  color: white;\n  padding: 26px;\n}\n.economic-board {\n  display: grid;\n  grid-template-columns: minmax(0, 1.35fr) minmax(280px, .9fr);\n  gap: 22px;\n  align-items: center;\n}\n.brand-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 12px;\n}\n.brand-grid span,\n.evolution-grid article {\n  border: 1px solid rgba(255,255,255,.18);\n  border-radius: 8px;\n  background: rgba(255,255,255,.11);\n  padding: 18px 14px;\n  text-align: center;\n  font-weight: 900;\n  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);\n}\n.value-stack {\n  border: 1px solid rgba(16,185,129,.45);\n  border-radius: 8px;\n  padding: 14px;\n  display: grid;\n  gap: 10px;\n}\n.value-stack span {\n  border-radius: 8px;\n  background: rgba(15,118,110,.72);\n  padding: 11px 14px;\n  text-align: center;\n  font-weight: 900;\n}\n.evolution-board { padding: 34px; }\n.evolution-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 12px;\n}\n.evolution-grid article {\n  min-height: 98px;\n  text-align: left;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n}\n.evolution-grid b {\n  display: block;\n  font-size: 15px;\n  margin-bottom: 6px;\n}\n.evolution-grid span {\n  color: #dbeafe;\n  font-size: 13px;\n}\n.evolution-options {\n  grid-template-columns: repeat(3, 1fr);\n  margin-bottom: 18px;\n}\n.evolution-choice {\n  border: 1px solid rgba(255,255,255,.18);\n  border-radius: 8px;\n  background: rgba(255,255,255,.11);\n  color: white;\n  padding: 18px 14px;\n  min-height: 98px;\n  text-align: left;\n  font-family: var(--font);\n  cursor: pointer;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  transition: background .15s, border-color .15s, transform .15s;\n}\n.evolution-choice:hover,\n.evolution-choice.active {\n  background: rgba(255,255,255,.2);\n  border-color: rgba(255,255,255,.42);\n  transform: translateY(-1px);\n}\n.evolution-choice b {\n  display: block;\n  font-size: 15px;\n  margin-bottom: 6px;\n}\n.evolution-choice span {\n  color: #dbeafe;\n  font-size: 13px;\n}\n.evolution-detail { margin-top: 12px; }\n.timeline-card {\n  background: white;\n  color: var(--ink);\n  border-radius: 12px;\n  padding: 22px;\n  box-shadow: 0 14px 40px rgba(0,0,0,.16);\n}\n.timeline-year {\n  color: #5b21b6;\n  font-size: 22px;\n  font-weight: 900;\n  text-align: center;\n  margin-bottom: 12px;\n}\n.timeline-title {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  border-radius: 0 999px 999px 0;\n  color: white;\n  padding: 10px 16px;\n  margin: 0 0 16px;\n  font-size: 18px;\n  font-weight: 900;\n  text-transform: uppercase;\n}\n.timeline-title span {\n  display: grid;\n  place-items: center;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  background: white;\n  color: currentColor;\n  font-weight: 900;\n}\n.direct-card .timeline-title { background: #5b21b6; }\n.network-card .timeline-title { background: #0b64b9; }\n.rtb-card .timeline-title { background: #f97316; }\n.direct-card .timeline-title span { color: #5b21b6; }\n.network-card .timeline-title span { color: #0b64b9; }\n.rtb-card .timeline-title span { color: #f97316; }\n.timeline-copy {\n  text-align: center;\n  font-size: 17px;\n  font-weight: 700;\n  line-height: 1.45;\n  margin: 8px 0 18px;\n}\n.timeline-flow {\n  display: flex;\n  align-items: stretch;\n  justify-content: center;\n  gap: 10px;\n  margin: 18px 0 22px;\n  flex-wrap: wrap;\n}\n.flow-node {\n  min-width: 120px;\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  background: #f8fafc;\n  padding: 13px 12px;\n  text-align: center;\n  text-transform: uppercase;\n  font-size: 11px;\n  font-weight: 900;\n}\n.flow-arrow {\n  display: grid;\n  place-items: center;\n  color: var(--navy);\n  font-weight: 900;\n}\n.timeline-note {\n  background: #f7f1ff;\n  border-radius: 12px;\n  padding: 16px;\n}\n.network-card .timeline-note { background: #edf6ff; }\n.rtb-card .timeline-note { background: #fff4ec; }\n.timeline-note b {\n  display: block;\n  color: var(--navy);\n  text-transform: uppercase;\n  margin-bottom: 6px;\n}\n.direct-card .timeline-note b { color: #5b21b6; }\n.network-card .timeline-note b { color: #0b64b9; }\n.rtb-card .timeline-note b { color: #ea580c; }\n.timeline-note ul {\n  margin: 0 0 12px;\n  padding-left: 18px;\n}\n.timeline-note ul:last-child { margin-bottom: 0; }\n.inventory-card { border-left-color: var(--practica); }\n.channels-board h3 {\n  color: white;\n  font-size: 34px;\n  line-height: 1.15;\n  margin: 0 0 22px;\n  max-width: 930px;\n}\n.channel-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 12px;\n}\n.channel-grid article {\n  border: 1px solid rgba(255,255,255,.18);\n  border-radius: 8px;\n  background: rgba(255,255,255,.11);\n  padding: 18px 16px;\n  min-height: 96px;\n}\n.channel-grid b {\n  display: block;\n  color: white;\n  font-size: 16px;\n  margin-bottom: 6px;\n}\n.channel-grid span {\n  color: #dbeafe;\n  font-size: 14px;\n}\n\n@media (max-width: 1100px) {\n  .economic-board { grid-template-columns: 1fr; }\n  .brand-grid, .evolution-grid, .evolution-options, .channel-grid { grid-template-columns: repeat(2, 1fr); }\n}\n\n@media (max-width: 700px) {\n  .dynamic-head { flex-direction: column; }\n  .dynamic-toggle { width: 100%; }\n  .dynamic-head h3 { font-size: 20px; }\n  .dark-board { padding: 16px; }\n  .brand-grid, .evolution-grid, .evolution-options { grid-template-columns: 1fr; }\n  .channel-grid { grid-template-columns: 1fr; }\n  .channels-board h3 { font-size: 24px; }\n  .timeline-card { padding: 16px; }\n  .timeline-title { font-size: 15px; }\n  .timeline-flow { justify-content: stretch; }\n  .flow-node { flex: 1 1 100%; }\n  .flow-arrow { width: 100%; }\n}\n<\u002Fstyle>\n  <!-- Capa SPW: barra superior sticky + scrollspy + apilado de secciones -->\n  <style>/* ============================================================\n   ESIC · Display & RTB · Sesión 1 — CAPA SPW (Single Page Website)\n   Se carga DESPUÉS de styles.css y solo sobrescribe lo necesario:\n   · Neutraliza el carrusel (todas las secciones visibles)\n   · Sustituye el sidebar por una barra superior sticky (estilo ESIC)\n   · Añade el resaltado Scrollspy y la reveladora de notas docentes\n   ============================================================ */\n\n/* 1) TODAS LAS SECCIONES VISIBLES ---------------------------------\n   styles.css declara `.screen{display:none}` para el modo carrusel.\n   Al cargarse después, esta regla lo revierte: scroll continuo real. */\n.screen { display: block; }\n\nbody { background: #eef2f8; }\n\n/* 2) BARRA SUPERIOR STICKY (estilo landing ESIC) ------------------ */\n.topnav {\n  position: sticky;\n  top: 0;\n  z-index: 60;\n  background: var(--navy-dark);\n  color: #fff;\n  box-shadow: 0 2px 18px rgba(8,19,42,.28);\n}\n.topnav-inner {\n  display: flex;\n  align-items: center;\n  gap: 18px;\n  max-width: 1320px;\n  margin: 0 auto;\n  padding: 11px 24px;\n}\n.topnav-brand {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  flex: 0 0 auto;\n}\n.topnav-brand .brand-logo {\n  height: 24px;\n  filter: brightness(0) invert(1);\n  opacity: .95;\n}\n.topnav-session {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  background: rgba(200,16,46,.22);\n  border: 1px solid rgba(200,16,46,.4);\n  color: #fca5a5;\n  font-size: 10.5px;\n  font-weight: 800;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  border-radius: 999px;\n  padding: 5px 10px;\n  white-space: nowrap;\n}\n.topnav-session .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--esic-red); }\n\n/* Enlaces de navegación: fila horizontal con scroll si no caben */\n.topnav-links {\n  display: flex;\n  gap: 3px;\n  flex: 1 1 auto;\n  min-width: 0;\n  overflow-x: auto;\n  scrollbar-width: thin;\n  scrollbar-color: rgba(255,255,255,.25) transparent;\n  padding-bottom: 2px;\n  scroll-behavior: smooth;\n}\n.topnav-links::-webkit-scrollbar { height: 6px; }\n.topnav-links::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 999px; }\n.topnav-links a {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  white-space: nowrap;\n  text-decoration: none;\n  color: #94a3b8;\n  font-size: 12.5px;\n  font-weight: 600;\n  padding: 7px 11px;\n  border-radius: 10px;\n  border: 1px solid transparent;\n  transition: background .15s, color .15s, border-color .15s;\n}\n.topnav-links a .n {\n  font-size: 10px;\n  font-weight: 900;\n  background: rgba(255,255,255,.1);\n  border-radius: 6px;\n  padding: 3px 5px;\n  line-height: 1;\n}\n.topnav-links a:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }\n/* --- Estado ACTIVO del Scrollspy (lo aplica/retira spw.js) --- */\n.topnav-links a.active {\n  background: rgba(200,16,46,.22);\n  color: #fff;\n  border-color: rgba(200,16,46,.4);\n}\n.topnav-links a.active .n { background: var(--esic-red); color: #fff; }\n\n/* Acciones a la derecha */\n.topnav-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }\n.tn-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font);\n  font-size: 12.5px;\n  font-weight: 700;\n  text-decoration: none;\n  cursor: pointer;\n  white-space: nowrap;\n  border-radius: 999px;\n  padding: 8px 14px;\n  border: 1px solid rgba(255,255,255,.2);\n  background: rgba(255,255,255,.06);\n  color: #e2e8f0;\n  transition: background .15s, border-color .15s, color .15s;\n}\n.tn-btn:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.32); color: #fff; }\n.tn-btn-primary { background: #fff; color: var(--navy); border-color: #fff; }\n.tn-btn-primary:hover { background: #e8edf5; color: var(--navy); }\n/* Botón \"Modo profesor\" cuando está activo */\n.tn-btn.on { background: var(--esic-red); border-color: var(--esic-red); color: #fff; }\n.tn-btn.on:hover { background: #a50d26; }\n\n/* Barra de progreso de lectura */\n.topnav-progress { height: 3px; background: rgba(255,255,255,.08); }\n#progress-fill { display: block; height: 100%; width: 0; background: var(--esic-red); transition: width .12s linear; }\n\n/* 3) CONTENIDO PRINCIPAL ------------------------------------------ */\n.spw-main {\n  max-width: 1120px;\n  margin: 0 auto;\n  padding: 26px 24px 110px;\n}\n\n/* Cada sección apilada; scroll-margin-top compensa la barra sticky\n   para que los saltos por ancla (#s05) no queden ocultos bajo el nav. */\n.screen {\n  border-top: 1px solid var(--line);\n  padding: 44px 0 8px;\n  scroll-margin-top: 92px;\n}\n.screen:first-of-type { border-top: 0; padding-top: 22px; }\n\n/* Una sola columna: la ficha docente se apila debajo de la del alumno */\n.content-grid { grid-template-columns: 1fr; }\n\n/* 4) NOTAS DOCENTES: ocultas salvo en modo profesor --------------- */\n.teacher-card { display: none; margin-top: 16px; }\nbody.profesor-on .teacher-card { display: block; }\n\n/* 5) RESPONSIVE --------------------------------------------------- */\n@media (max-width: 1024px) {\n  .topnav-session { display: none; }\n}\n@media (max-width: 720px) {\n  .topnav-inner { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }\n  .topnav-links { order: 3; width: 100%; }\n  .topnav-actions { margin-left: auto; }\n  .spw-main { padding: 18px 16px 90px; }\n  .screen { padding: 32px 0 4px; scroll-margin-top: 132px; }\n}\n<\u002Fstyle>\n  <!-- Capa dinámica: componentes interactivos del rediseño de secciones -->\n  <style>/* ============================================================\n   ESIC · Display & RTB · Sesión 1 — CAPA DINÁMICA\n   Componentes interactivos para el rediseño de secciones:\n   reveal al scroll · hero · carrusel numerado (estilo ESIC) ·\n   \"viaje\" horizontal clicable · dossier · tabs · checklist ·\n   placeholders de imagen. Todo vanilla, se apoya en los tokens\n   de styles.css (--navy, --esic-red, --line, --muted, --font…).\n   ============================================================ */\n\n/* Acentos por tipo de sección (la lógica de color por bloque) */\n.acc-teoria   { --acc: var(--teoria); }\n.acc-practica { --acc: var(--practica); }\n.acc-reto     { --acc: var(--reto); }\n.acc-red      { --acc: var(--esic-red); }\n\n/* Ritmo vertical de las secciones rediseñadas */\n.screen.flag > * + * { margin-top: 24px; }\n\n/* Micro-cabeceras reutilizables */\n.blocktitle {\n  font-size: 13px; font-weight: 900; text-transform: uppercase;\n  letter-spacing: .1em; color: var(--esic-red); margin: 0 0 14px;\n}\n.blocklead { margin: -4px 0 16px; color: var(--muted); max-width: 780px; }\n.sec-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }\n.sec-meta span {\n  font-size: 11.5px; font-weight: 600; color: var(--muted);\n  background: #fff; border: 1px solid var(--line);\n  border-radius: 999px; padding: 5px 12px;\n}\n.sec-meta b { color: var(--navy); }\n\n/* ─── 1) REVEAL AL HACER SCROLL (mejora progresiva) ──────────\n   Sin JS todo es visible. spw/dynamic.js añade .js-reveal al <html>,\n   oculta y luego revela con .is-in al entrar en pantalla. */\n.js-reveal [data-reveal] {\n  opacity: 0; transform: translateY(20px);\n  transition: opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1);\n  transition-delay: calc(var(--i, 0) * 70ms);\n}\n.js-reveal [data-reveal].is-in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  .js-reveal [data-reveal] { opacity: 1 !important; transform: none !important; transition: none; }\n  [data-journey] .journey-node { animation: none !important; opacity: 1 !important; }\n}\n\n/* ─── 2) HERO (S00) ──────────────────────────────────────── */\n.hero2 {\n  position: relative; overflow: hidden;\n  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);\n  color: #fff; border-radius: 24px; padding: 46px;\n  display: grid; grid-template-columns: 1.3fr .9fr; gap: 38px; align-items: center;\n}\n.hero2::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 5px;\n  background: linear-gradient(90deg, var(--esic-red), #f97316);\n}\n.hero2 .eyebrow { color: #fca5a5; }\n.hero2 h2 {\n  font-size: 46px; font-weight: 900; letter-spacing: -.04em;\n  line-height: 1.02; margin: 6px 0 14px; color: #fff;\n}\n.hero2-sub { font-size: 18px; color: #cbd5e1; margin: 0 0 24px; max-width: 540px; }\n.hero2 .btn { background: #fff; color: var(--navy); }\n.hero2 .btn.alt { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.28); box-shadow: none; }\n\n.stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 26px; }\n.stat {\n  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);\n  border-radius: 14px; padding: 12px 18px; min-width: 92px;\n}\n.stat b { display: block; font-size: 30px; font-weight: 900; color: #fff; line-height: 1; }\n.stat span { font-size: 12px; color: #94a3b8; font-weight: 600; }\n\n/* ─── 3) PLACEHOLDER DE IMAGEN (a rellenar por el usuario) ─── */\n.ph {\n  position: relative; display: grid; place-items: center; text-align: center;\n  min-height: 200px; padding: 22px; border-radius: 16px;\n  border: 1px solid var(--line); color: #64748b;\n  font-family: var(--mono); font-size: 12px; line-height: 1.5;\n  background: repeating-linear-gradient(45deg, #eef2f8, #eef2f8 10px, #e6ebf3 10px, #e6ebf3 20px);\n}\n.ph span {\n  background: rgba(255,255,255,.9); border: 1px solid var(--line);\n  border-radius: 8px; padding: 7px 12px; max-width: 90%;\n}\n.ph.dark {\n  color: #94a3b8; border-color: rgba(255,255,255,.14);\n  background: repeating-linear-gradient(45deg, #0f2138, #0f2138 10px, #13273f 10px, #13273f 20px);\n}\n.ph.dark span { background: rgba(8,19,42,.6); border-color: rgba(255,255,255,.12); }\n\n/* ─── 4) CARRUSEL NUMERADO (estilo ESIC) ─────────────────── */\n.esic-carousel { position: relative; }\n.ec-track {\n  display: flex; gap: 20px; overflow-x: auto; padding: 4px 2px 8px;\n  scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;\n}\n.ec-track::-webkit-scrollbar { display: none; }\n.ec-card {\n  scroll-snap-align: start; flex: 0 0 calc(50% - 10px); min-width: 250px;\n  background: #fff; border: 1px solid var(--line); border-radius: 18px;\n  box-shadow: var(--shadow-sm); padding: 28px;\n  transition: transform .18s, box-shadow .18s, border-color .18s;\n}\n.ec-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: #cbd5e1; }\n.ec-num { font-size: 46px; font-weight: 900; color: var(--teoria); line-height: 1; letter-spacing: -.03em; }\n.ec-card h4 { margin: 14px 0 8px; font-size: 18px; color: var(--navy); }\n.ec-card p { margin: 0; color: var(--muted); font-size: 14px; }\n.ec-controls { display: flex; align-items: center; gap: 16px; margin-top: 18px; }\n.ec-segs { display: flex; gap: 8px; flex: 1; }\n.ec-seg { height: 3px; flex: 1; max-width: 60px; background: var(--line); border-radius: 2px; cursor: pointer; transition: background .3s; border: none; padding: 0; }\n.ec-seg.on { background: var(--navy); }\n.ec-arrows { display: flex; gap: 8px; }\n.ec-arrow {\n  width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--navy);\n  background: #fff; color: var(--navy); cursor: pointer; display: grid; place-items: center;\n  font-size: 20px; line-height: 1; transition: background .15s, color .15s, opacity .15s;\n}\n.ec-arrow:hover { background: var(--navy); color: #fff; }\n.ec-arrow:disabled { opacity: .28; background: #fff; color: var(--navy); cursor: default; }\n\n/* ─── 5) EL \"VIAJE\" HORIZONTAL CLICABLE (hilo unificador) ─── */\n.journey { --acc: var(--esic-red); }\n.journey-track {\n  display: flex; gap: 0; overflow-x: auto; padding: 4px 0 6px;\n  scrollbar-width: none;\n}\n.journey-track::-webkit-scrollbar { display: none; }\n.journey-node {\n  flex: 1 0 auto; min-width: 104px; display: flex; flex-direction: column;\n  align-items: center; gap: 9px; padding: 4px 6px; position: relative;\n  background: none; border: none; cursor: pointer; font-family: var(--font);\n}\n.journey-node::after {\n  content: \"\"; position: absolute; top: 21px; left: 50%; width: 100%; height: 3px;\n  background: var(--line); z-index: 0;\n}\n.journey-node:last-child::after { display: none; }\n.journey-node.done::after { background: var(--acc); }\n.jn-dot {\n  position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%;\n  display: grid; place-items: center; background: #fff; border: 3px solid var(--line);\n  font-weight: 900; color: var(--muted); transition: background .25s, border-color .25s, color .25s, transform .25s;\n}\n.journey-node.done .jn-dot { border-color: var(--acc); color: var(--acc); }\n.journey-node.active .jn-dot { background: var(--acc); border-color: var(--acc); color: #fff; transform: scale(1.1); }\n.jn-label { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; max-width: 120px; }\n.journey-node.active .jn-label,\n.journey-node.done .jn-label { color: var(--navy); }\n.journey[data-static] .journey-node { cursor: default; }\n\n/* Aparición escalonada de los nodos al entrar en pantalla */\n.js-reveal [data-journey] .journey-node { opacity: 0; transform: translateY(10px); }\n[data-journey].is-in .journey-node { animation: jn-pop .5s both; animation-delay: calc(var(--i, 0) * 90ms); }\n@keyframes jn-pop { to { opacity: 1; transform: none; } }\n\n.journey-panels { margin-top: 24px; }\n.journey-panel { display: none; }\n.journey-panel.active { display: block; animation: fade-up .35s both; }\n.journey-panel h4 { margin: 0 0 8px; font-size: 19px; color: var(--navy); }\n.journey-panel p { margin: 0; color: var(--ink-mid); font-size: 15px; line-height: 1.6; }\n.journey-panel a { color: var(--acc); font-weight: 700; text-decoration: none; }\n.journey-panel a:hover { text-decoration: underline; }\n@keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n\n/* ─── 6) TARJETAS \"QUÉ HAREMOS\" + NOTA + PANELES ─────────── */\n.qcards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }\n.qcard {\n  background: #fff; border: 1px solid var(--line); border-radius: 16px;\n  padding: 22px; box-shadow: var(--shadow-sm);\n  transition: transform .18s, box-shadow .18s, border-color .18s;\n}\n.qcard:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: #cbd5e1; }\n.qcard .k { font-size: 12px; font-weight: 900; color: var(--teoria); letter-spacing: .06em; margin-bottom: 10px; }\n.qcard b { display: block; font-size: 16px; color: var(--navy); margin-bottom: 4px; }\n.qcard span { color: var(--muted); font-size: 13.5px; }\n\n/* Tarjetas de concepto expandibles (S07) */\n.qcard-ex { cursor: pointer; text-align: left; font: inherit; width: 100%; display: block; }\n.qcard-ex.active { border-color: var(--teoria); box-shadow: 0 0 0 2px rgba(29,78,216,.14), var(--shadow); }\n.qcard-ex-body {\n  max-height: 0; overflow: hidden; opacity: 0;\n  margin-top: 0; padding-top: 0; border-top: 1px solid transparent;\n  color: var(--navy); font-size: 13.5px; line-height: 1.5;\n  transition: max-height .25s ease, opacity .2s ease, margin-top .25s ease, padding-top .25s ease;\n}\n.qcard-ex.active .qcard-ex-body {\n  max-height: 200px; opacity: 1;\n  margin-top: 12px; padding-top: 12px; border-top-color: var(--line);\n}\n\n/* Tarjetas de canal clicables (S02) */\n.channel-card { font-family: var(--font); text-align: left; cursor: pointer; transition: background .25s, color .25s, transform .18s, box-shadow .18s; }\n.channel-card.active {\n  background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));\n  border-color: transparent; color: #fff; transform: translateY(-2px);\n  box-shadow: 0 16px 40px rgba(8,19,42,.28);\n}\n.channel-card.active .k { color: #6ee7b7 !important; }\n.channel-card.active b { color: #fff; }\n.channel-card.active span { color: #cbd5e1; }\n.channel-detail {\n  margin-top: 18px; position: relative;\n  background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));\n  color: #fff; border: none; border-radius: 18px;\n  box-shadow: 0 16px 40px rgba(8,19,42,.28); padding: 26px 28px;\n  animation: detail-pop .32s cubic-bezier(.2,.8,.2,1) both;\n}\n.channel-detail::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 4px;\n  border-radius: 18px 18px 0 0; background: linear-gradient(90deg, var(--practica), #34d399);\n}\n.channel-detail[hidden] { display: none; }\n.channel-detail .vs { margin: 0; }\n.channel-detail .vs div {\n  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);\n  color: #fff; border-radius: 14px; padding: 18px 20px; font-size: 16px;\n}\n.channel-detail .vs b {\n  color: #6ee7b7; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px;\n}\n.channel-example { margin: 16px 0 0; font-size: 14px; font-weight: 700; color: #cbd5e1; }\n.channel-example a { color: #6ee7b7; text-decoration: none; }\n.channel-example a:hover { text-decoration: underline; }\n@keyframes detail-pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }\n\n/* ─── Evolución del display \"Antes → Ahora\" (S02) ──────────── */\n.evo-headline { font-size: 22px; font-weight: 900; color: var(--navy); letter-spacing: -.02em; margin: 0 0 4px; }\n.evo-headline b { color: var(--esic-red); }\n.evo-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: stretch; margin-top: 18px; }\n.evo-col { border-radius: 16px; padding: 22px; }\n.evo-col.before { background: var(--silver); border: 1px solid var(--line); }\n.evo-col.now { background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid)); color: #fff; position: relative; overflow: hidden; }\n.evo-col.now::before { content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--esic-red), #f97316); }\n.evo-eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 4px; }\n.evo-col.before .evo-eyebrow { color: var(--muted); }\n.evo-col.now .evo-eyebrow { color: #fca5a5; }\n.evo-col h4 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }\n.evo-col.before h4 { color: var(--navy); }\n.evo-col.now h4 { color: #fff; }\n.evo-chips { display: flex; flex-wrap: wrap; gap: 8px; }\n.evo-chips span {\n  font-size: 13px; font-weight: 700; border-radius: 999px; padding: 7px 13px; white-space: nowrap;\n}\n.evo-col.before .evo-chips span { background: #fff; border: 1px solid var(--line); color: #64748b; }\n.evo-col.now .evo-chips span { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); color: #fff; }\n.evo-col.now .evo-chips span.hot { background: var(--esic-red); border-color: var(--esic-red); }\n.evo-arrow { display: grid; place-items: center; color: var(--esic-red); font-size: 34px; font-weight: 900; }\n\n/* Chip clicable dentro del bloque de evolución (S02) */\n.evo-chip-btn {\n  font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer;\n  border-radius: 999px; padding: 7px 13px; white-space: nowrap;\n  background: #fff; border: 1px solid var(--practica); color: var(--practica);\n  transition: background .18s, color .18s, transform .18s;\n}\n.evo-chip-btn::after { content: \" +\"; font-weight: 900; }\n.evo-chip-btn:hover { transform: translateY(-1px); }\n.evo-chip-btn.active { background: var(--practica); color: #fff; border-color: var(--practica); }\n.evo-chip-btn.active::after { content: \" –\"; }\n.evo-detail {\n  margin-top: 16px; background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));\n  color: #fff; border-radius: 14px; padding: 18px 22px; animation: detail-pop .3s cubic-bezier(.2,.8,.2,1) both;\n}\n.evo-detail[hidden] { display: none; }\n.evo-detail ul { margin: 10px 0 0; padding-left: 20px; }\n.evo-detail li { margin: 5px 0; font-size: 15px; color: #e2e8f0; }\n\n/* Maqueta de slot publicitario dentro del detalle de formato (S02) */\n.ad-slot-mock {\n  position: relative; margin: 4px 0 12px; border-radius: 12px;\n  border: 2px dashed #c3ccdb;\n  background: repeating-linear-gradient(45deg, #eef1f6, #eef1f6 10px, #e4e9f1 10px, #e4e9f1 20px);\n  display: grid; place-items: center; text-align: center;\n  color: var(--navy); font-weight: 800; font-size: 15px;\n  width: 100%; max-width: 300px; aspect-ratio: 300 / 250; padding: 18px;\n}\n.ad-slot-mock .pub-label {\n  position: absolute; top: 12px; left: 14px; font-size: 10px;\n  letter-spacing: .16em; color: #8a97ab; font-weight: 800;\n}\n.ad-slot-stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 6px; }\n@media (max-width: 780px) {\n  .evo-grid { grid-template-columns: 1fr; }\n  .evo-arrow { transform: rotate(90deg); font-size: 26px; }\n}\n\n.note-card, .panel-card, .thread-wrap {\n  background: #fff; border: 1px solid var(--line); border-radius: 20px;\n  box-shadow: var(--shadow-sm); padding: 28px;\n}\n.note-card { border-left: 4px solid var(--teoria); }\n\n/* ─── 7) DOSSIER (escenario S07) ─────────────────────────── */\n.dossier {\n  background: linear-gradient(135deg, var(--navy-dark), var(--navy-mid));\n  color: #fff; border-radius: 18px; padding: 26px;\n  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px;\n}\n.dossier .df { border-left: 3px solid var(--esic-red); padding-left: 13px; }\n.dossier .df b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #fca5a5; margin-bottom: 5px; }\n.dossier .df span { font-size: 15px; font-weight: 700; }\n\n/* ─── 8) TABS (rondas S07) ───────────────────────────────── */\n.tabs-nav { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 2px solid var(--line); }\n.tab-btn {\n  border: none; background: none; font-family: var(--font); font-weight: 800; font-size: 14px;\n  color: var(--muted); padding: 12px 16px; cursor: pointer;\n  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s;\n}\n.tab-btn:hover { color: var(--navy); }\n.tab-btn.active { color: var(--navy); border-bottom-color: var(--acc); }\n.tab-panel { display: none; padding: 20px 2px 2px; }\n.tab-panel.active { display: block; animation: fade-up .3s both; }\n.tab-panel p { margin: 0; font-size: 15px; color: var(--ink-mid); }\n.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 0; }\n.vs div { background: var(--silver); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 700; color: var(--navy); }\n.vs b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin-bottom: 5px; }\n\n/* ─── 9) CHECKLIST (actividad) ──────────────────────────── */\n.callout { background: var(--reto-bg); border: 1px solid #fcd34d; border-radius: 16px; padding: 20px 22px; }\n.checklist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }\n.checklist li {\n  display: flex; align-items: center; gap: 12px; background: #fff;\n  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;\n  cursor: pointer; font-weight: 600; font-size: 14px; transition: border-color .15s, color .15s;\n}\n.checklist li:hover { border-color: var(--acc); }\n.checklist .box {\n  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line);\n  display: grid; place-items: center; flex: 0 0 auto; color: transparent; font-size: 13px; transition: .15s;\n}\n.checklist li.done .box { background: var(--acc); border-color: var(--acc); color: #fff; }\n.checklist li.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }\n\n/* ─── 10) SPLIT (imagen + cita en S04) ───────────────────── */\n.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }\n.bq-big {\n  margin: 0; display: flex; align-items: center;\n  border-left: 4px solid var(--esic-red); background: var(--esic-red-light);\n  border-radius: 0 16px 16px 0; padding: 24px; font-size: 18px; font-weight: 800;\n  color: #7f0e1e; line-height: 1.35;\n}\n\n/* ─── Responsive ─────────────────────────────────────────── */\n@media (max-width: 900px) {\n  .hero2 { grid-template-columns: 1fr; padding: 30px; }\n  .hero2 h2 { font-size: 34px; }\n  .qcards { grid-template-columns: repeat(2, 1fr); }\n  .split { grid-template-columns: 1fr; }\n  .ec-card { flex-basis: 82%; }\n}\n@media (max-width: 560px) {\n  .qcards { grid-template-columns: 1fr; }\n  .dossier { grid-template-columns: 1fr 1fr; }\n  .vs { grid-template-columns: 1fr; }\n}\n\n/* ─── 11) LEADERBOARD 728×90 STICKY (nota = creatividad) ─────\n   Anchor ad anclado al fondo, centrado, tipo Visa/Wise. La \"nota\n   clave\" de cada sección se sirve como creatividad y cambia con el\n   scroll. Lo controla assets/adslot.js (evento spw:section). */\n.adslot {\n  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;\n  width: calc(100% - 24px); max-width: 728px; z-index: 45;\n  border-radius: 10px 10px 0 0; overflow: hidden; font-family: var(--font);\n  box-shadow: 0 -10px 44px rgba(8,19,42,.32);\n}\n.adslot[hidden] { display: none; }\n.adslot-creative {\n  position: relative; display: flex; align-items: center; gap: 18px;\n  height: 90px; padding: 0 46px 0 20px; color: #fff;\n  background: var(--adbg, linear-gradient(135deg, #0D1F3C, #1A3058));\n  transition: background .45s ease;\n}\n.adslot-creative.loading { filter: blur(1.5px); opacity: .4; }\n.adslot-creative.served { animation: ad-in .4s both; }\n@keyframes ad-in { from { opacity: 0; } to { opacity: 1; } }\n.adslot-left {\n  flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px;\n  padding-right: 18px; border-right: 1px solid rgba(255,255,255,.28);\n}\n.adslot-tag { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.72); white-space: nowrap; }\n.adslot-kicker { font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; }\n.adslot-copy {\n  flex: 1; margin: 0; font-size: 15px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em;\n  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\n}\n.adslot-cta {\n  flex: 0 0 auto; font-size: 12px; font-weight: 800; white-space: nowrap;\n  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4);\n  border-radius: 999px; padding: 7px 15px;\n}\n.adslot-close {\n  position: absolute; top: 6px; right: 8px; z-index: 3; border: none; cursor: pointer;\n  background: rgba(0,0,0,.2); color: #fff; font-size: 13px; line-height: 1;\n  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;\n}\n.adslot-close:hover { background: rgba(0,0,0,.4); }\n.adslot-serving {\n  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;\n  gap: 9px; background: rgba(8,19,42,.82); color: #fff; font-size: 12px; font-weight: 700;\n}\n.adslot-serving.on { display: flex; }\n.adslot-serving .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--esic-red); animation: adpulse 1s infinite; }\n@keyframes adpulse { 0%,100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.35); } }\n.adslot-reopen {\n  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 45; cursor: pointer;\n  border: 1px solid var(--line); border-bottom: none; background: #fff; color: var(--navy);\n  font-weight: 800; font-size: 12px; font-family: var(--font);\n  border-radius: 10px 10px 0 0; padding: 8px 18px; box-shadow: 0 -6px 24px rgba(8,19,42,.18);\n  display: inline-flex; align-items: center; gap: 7px;\n}\n.adslot-reopen::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: var(--esic-red); }\n.adslot-reopen[hidden] { display: none; }\n\n/* Aire al final para que el leaderboard no tape la última sección */\n.spw-main { padding-bottom: 130px; }\n\n@media (max-width: 560px) {\n  .adslot { width: 100%; border-radius: 0; }\n  .adslot-left, .adslot-cta { display: none; }\n  .adslot-creative { height: auto; min-height: 66px; padding: 12px 40px 12px 16px; }\n  .adslot-copy { font-size: 13px; -webkit-line-clamp: 3; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ══════════════════════════════════════════════════════════════\n     BARRA SUPERIOR STICKY  ·  Menú con Scrollspy (estilo ESIC)\n     Los <a href=\"#sNN\"> son anclas internas; el desplazamiento\n     suave lo aporta `html{scroll-behavior:smooth}` de styles.css.\n     El resaltado activo lo gestiona assets/spw.js (IntersectionObserver).\n     ══════════════════════════════════════════════════════════════ -->\n<header class=\"topnav\">\n  <div class=\"topnav-inner\">\n    <div class=\"topnav-brand\">\n      <svg class=\"brand-logo\" viewBox=\"0 0 120 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"ESIC University\">\n        <text x=\"0\" y=\"22\" font-family=\"Inter,sans-serif\" font-weight=\"900\" font-size=\"24\" fill=\"white\" letter-spacing=\"-1\">ESIC<\u002Ftext>\n        <text x=\"58\" y=\"22\" font-family=\"Inter,sans-serif\" font-weight=\"400\" font-size=\"12\" fill=\"#94a3b8\" letter-spacing=\"1\">UNIVERSITY<\u002Ftext>\n      <\u002Fsvg>\n      <span class=\"topnav-session\"><span class=\"dot\"><\u002Fspan>Sesión 1 · Viernes<\u002Fspan>\n    <\u002Fdiv>\n\n    <nav class=\"topnav-links\" id=\"spw-nav\" aria-label=\"Secciones de la sesión\">\n      <a href=\"#s00\" class=\"active\">Bienvenida<\u002Fa>\n      <a href=\"#s01\">Evolución digital<\u002Fa>\n      <a href=\"#s02\">Inventario y formatos<\u002Fa>\n      <a href=\"#s03\">Detectives AdTech<\u002Fa>\n      <a href=\"#s04\">Inspector AdTech<\u002Fa>\n      <a href=\"#s05\">Header Bidding<\u002Fa>\n      <a href=\"#s06\">DevTools real<\u002Fa>\n      <a href=\"#s07\">Floor &amp; GAM<\u002Fa>\n      <a href=\"#s08\">Subasta RTB<\u002Fa>\n      <a href=\"#s09\">Caso Last Look<\u002Fa>\n      <a href=\"#s10\">Impresión y viewability<\u002Fa>\n      <a href=\"#s11\">Cierre sesión 1<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"topnav-actions\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"topnav-progress\"><span id=\"progress-fill\"><\u002Fspan><\u002Fdiv>\n<\u002Fheader>\n\n<!-- ── Overlay de clave eliminado (modo profesor desactivado) ──── -->\n\n<main class=\"spw-main\">\n\n  <!-- ══════════ S00 · Bienvenida ══════════ -->\n  <section class=\"screen flag\" id=\"s00\">\n\n    <!-- Hero -->\n    <div class=\"hero2\" data-reveal=\"\">\n      <div class=\"hero2-main\">\n        <p class=\"eyebrow\">Pantalla 00 · 5–10 min · Bienvenida<\u002Fp>\n        <h2>El viaje de una impresión publicitaria<\u002Fh2>\n        <p class=\"hero2-sub\">Una sesión práctica: cómo una web convierte un espacio publicitario en una impresión servida, medida y monetizada.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"hero2-aside\">\n        <figure style=\"margin:0;\">\n          <img src=\"a8606839-9a16-46a5-b000-4fcec1c35b74\" alt=\"Ecosistema de compraventa programática de publicidad (IAB Spain): demand side, ad exchange y supply side\" style=\"width:100%; height:auto; display:block; border-radius:14px; border:1px solid rgba(255,255,255,.12); box-shadow:var(--shadow);\">\n          <figcaption style=\"margin-top:8px; font-size:11.5px; color:var(--muted); text-align:right;\">Programmatic Ad Buying &amp; Selling Ecosystem · © IAB Spain<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Hilo unificador: el viaje (vista previa) -->\n    <div class=\"thread-wrap\" data-reveal=\"\">\n      <p class=\"blocktitle\">Esto es lo que vamos a recorrer hoy<\u002Fp>\n      <div class=\"journey acc-red is-in\" data-journey=\"\" data-static=\"\">\n        <div class=\"journey-track\">\n          <div class=\"journey-node done\" style=\"--i:0\"><span class=\"jn-dot\">1<\u002Fspan><span class=\"jn-label\">Inventario<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:1\"><span class=\"jn-dot\">2<\u002Fspan><span class=\"jn-label\">Slot<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:2\"><span class=\"jn-dot\">3<\u002Fspan><span class=\"jn-label\">Subasta<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:3\"><span class=\"jn-dot\">4<\u002Fspan><span class=\"jn-label\">Creatividad<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:4\"><span class=\"jn-dot\">5<\u002Fspan><span class=\"jn-label\">Impresión<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:5\"><span class=\"jn-dot\">6<\u002Fspan><span class=\"jn-label\">Viewability<\u002Fspan><\u002Fdiv>\n          <div class=\"journey-node done\" style=\"--i:6\"><span class=\"jn-dot\">7<\u002Fspan><span class=\"jn-label\">Conversión<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Qué vamos a hacer hoy -->\n    <div data-reveal=\"\">\n      <p class=\"blocktitle\">Qué vamos a hacer hoy<\u002Fp>\n      <p class=\"blocklead\">No vamos a trabajar con PowerPoint. Trabajaremos con una web de clase, herramientas y casos prácticos alineados con el caso PlayStation.<\u002Fp>\n      <div class=\"qcards\">\n        <div class=\"qcard\"><div class=\"k\">01<\u002Fdiv><b>Observaremos<\u002Fb><span>anuncios reales en webs reales.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">02<\u002Fdiv><b>Investigaremos<\u002Fb><span>señales técnicas con DevTools y Google Publisher Console.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">03<\u002Fdiv><b>Simularemos<\u002Fb><span>subastas RTB y decisiones de precio.<\u002Fspan><\u002Fdiv>\n        <div class=\"qcard\"><div class=\"k\">04<\u002Fdiv><b>Explicaremos<\u002Fb><span>el viaje completo de una impresión.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Quién os acompaña + cita -->\n    <div class=\"note-card\" data-reveal=\"\">\n      <span class=\"tag tag-teoria\">Introducción<\u002Fspan>\n      <p>Trabajo con campañas, datos, leads y plataformas reales. Por eso he diseñado esta sesión como me habría gustado que me explicaran la programática al principio: viendo el proceso, tocando herramientas y tomando decisiones.<\u002Fp>\n    <\u002Fdiv>\n\n    <aside class=\"teacher-card\">\n      <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n      <h3>Pantalla 00<\u002Fh3>\n      <p><b>Objetivo docente:<\u002Fb> romper la expectativa de clase teórica y colocar al alumno en modo investigación.<\u002Fp>\n      <p><b>Guion:<\u002Fb> \"Hoy no vamos a estudiar programática desde una lista de siglas. Vamos a seguir una impresión publicitaria.\"<\u002Fp>\n      <p><b>Evitar:<\u002Fb> convertir la bienvenida en un CV largo.<\u002Fp>\n    <\u002Faside>\n    <div class=\"pager\"><span><\u002Fspan><a href=\"#s01\">01 · Evolución de la compra digital →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S01 · Evolución ══════════ -->\n  <section class=\"screen flag\" id=\"s01\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 01 · 20 min<\u002Fp>\n      <h2>Evolución de la compra digital<\u002Fh2>\n      <p class=\"subtitle\">De comprar espacios a comprar impresiones en tiempo real.<\u002Fp>\n      <p class=\"lead\">La programática aparece porque la compra manual no podía escalar al ritmo de Internet.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · entender por qué nace la programática<\u002Fspan><span><b>Tiempo<\u002Fb> · 20 min<\u002Fspan><span><b>Tipo<\u002Fb> · Teoría<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"content-grid\" data-reveal=\"\">\n      <main class=\"student-card session01-card\">\n        <span class=\"tag tag-teoria\">Teoría<\u002Fspan>\n        <div class=\"accordion-stack\">\n          <article class=\"dynamic-block is-open\" data-reveal=\"\">\n            <div class=\"dynamic-head\">\n              <div>\n                <span class=\"dynamic-kicker\">Modelo económico<\u002Fspan>\n                <h3>Si nadie paga por entrar, ¿quién sostiene el contenido?<\u002Fh3>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"dynamic-panel\">\n              <div class=\"dark-board economic-board\">\n                <div class=\"brand-grid\">\n                  <span>YouTube<\u002Fspan><span>Marca<\u002Fspan><span>El País<\u002Fspan><span>Twitch<\u002Fspan>\n                  <span>Spotify<\u002Fspan><span>TikTok<\u002Fspan><span>Atresplayer<\u002Fspan><span>Amazon<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"value-stack\" aria-label=\"Elementos que sostienen el contenido\">\n                  <span>Contenido<\u002Fspan><span>Audiencia<\u002Fspan><span>Publicidad<\u002Fspan><span>Datos<\u002Fspan><span>Suscripción<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n\n          <article class=\"dynamic-block is-open\" data-reveal=\"\">\n            <div class=\"dynamic-head\">\n              <div>\n                <span class=\"dynamic-kicker\">Evolución de la compra digital<\u002Fspan>\n                <h3>Antes comprábamos espacios. Hoy compramos oportunidades de impacto.<\u002Fh3>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"dynamic-panel\">\n              <p class=\"dynamic-question\">¿Qué problema aparece cuando la compra directa ya no puede gestionar todo el inventario?<\u002Fp>\n              <div class=\"dark-board evolution-board evolution-interactive\">\n                <div class=\"evolution-grid evolution-options\" aria-label=\"Modelos de compra digital\">\n                  <button class=\"evolution-choice active\" type=\"button\" data-evolution=\"directa\"><b>Compra directa<\u002Fb><span>Venta directa<\u002Fspan><\u002Fbutton>\n                  <button class=\"evolution-choice\" type=\"button\" data-evolution=\"redes\"><b>Redes<\u002Fb><span>Agrupan inventario<\u002Fspan><\u002Fbutton>\n                  <button class=\"evolution-choice\" type=\"button\" data-evolution=\"rtb\"><b>Programática y RTB<\u002Fb><span>Decisión impresión a impresión<\u002Fspan><\u002Fbutton>\n                <\u002Fdiv>\n\n                <div class=\"evolution-detail active\" data-evolution-panel=\"directa\">\n                  <div class=\"timeline-card direct-card\">\n                    <div class=\"timeline-year\">1995<\u002Fdiv>\n                    <div class=\"timeline-title\"><span>1<\u002Fspan>Venta directa<\u002Fdiv>\n                    <p class=\"timeline-copy\">Marca.com vende directamente a Coca-Cola<\u002Fp>\n                    <div class=\"timeline-flow\">\n                      <div class=\"flow-node\">Publisher<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">Anunciante<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"timeline-note\">\n                      <b>Problema:<\u002Fb>\n                      <ul><li>Escala muy limitada<\u002Fli><li>Mucha gestión comercial<\u002Fli><li>Difícil vender todo el inventario<\u002Fli><\u002Ful>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"evolution-detail\" data-evolution-panel=\"redes\" hidden=\"\">\n                  <div class=\"timeline-card network-card\">\n                    <div class=\"timeline-title\"><span>2<\u002Fspan>Redes - agrupan inventario<\u002Fdiv>\n                    <p class=\"timeline-copy\">DoubleClick<br>ValueClick<br>Advertising.com<\u002Fp>\n                    <div class=\"timeline-flow three\">\n                      <div class=\"flow-node\">Publishers<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">Ad network<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">Anunciante<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"timeline-note\">\n                      <b>Ventajas:<\u002Fb>\n                      <ul><li>Más escala<\u002Fli><li>Compra centralizada<\u002Fli><\u002Ful>\n                      <b>Problemas:<\u002Fb>\n                      <ul><li>Segmentación limitada<\u002Fli><li>Poca transparencia<\u002Fli><li>Compras “a ciegas”<\u002Fli><\u002Ful>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"evolution-detail\" data-evolution-panel=\"rtb\" hidden=\"\">\n                  <div class=\"timeline-card rtb-card\">\n                    <div class=\"timeline-title\"><span>4<\u002Fspan>Programática y RTB<\u002Fdiv>\n                    <p class=\"timeline-copy\">Ad Exchange<br>SSP<br>DSP<br>Real Time Bidding<\u002Fp>\n                    <div class=\"timeline-flow five\">\n                      <div class=\"flow-node\">Usuario entra en una web<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">SSP<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">Ad exchange<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">DSPs compiten<\u002Fdiv><div class=\"flow-arrow\">→<\u002Fdiv><div class=\"flow-node\">Ganador muestra anuncio<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div class=\"timeline-note\">\n                      <b>Ventajas:<\u002Fb>\n                      <ul><li>Compra impresión a impresión<\u002Fli><li>Compra audiencias<\u002Fli><li>Automatización<\u002Fli><li>Escala masiva<\u002Fli><li>Optimización algorítmica<\u002Fli><\u002Ful>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fmain>\n      <aside class=\"teacher-card\">\n        <span class=\"tag tag-reto\">Guía docente<\u002Fspan>\n        <h3>Pantalla 01<\u002Fh3>\n        <p><b>Objetivo docente:<\u002Fb> que entiendan la necesidad de la programática antes de aprender sus piezas técnicas.<\u002Fp>\n        <p><b>Pregunta:<\u002Fb> Si una marca quiere anunciarse hoy en miles de webs, apps y vídeos, ¿puede negociarlo todo manualmente?<\u002Fp>\n        <p><b>Evitar:<\u002Fb> explicar todavía DSP, SSP, Ad Exchange, Open Bidding o GAM.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n    <div class=\"pager\"><a href=\"#s00\">← 00 · Bienvenida<\u002Fa><a href=\"#s02\">02 · Inventario y formatos →<\u002Fa><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══════════ S02 · Inventario ══════════ -->\n  <section class=\"screen flag\" id=\"s02\">\n    <div class=\"screen-head\" data-reveal=\"\">\n      <p class=\"eyebrow\">Pantalla 02 · 1,30 h<\u002Fp>\n      <h2>El inventario programático<\u002Fh2>\n      <p class=\"subtitle\">Aquí encontramos dónde puede aparecer la publicidad digital.<\u002Fp>\n      <p class=\"lead\">El inventario no vive solo en una web: el mecanismo viaja entre canales, aunque cada canal tenga señales y restricciones distintas.<\u002Fp>\n      <div class=\"sec-meta\"><span><b>Objetivo<\u002Fb> · pensar en inventario, no en banne u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"display\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Impresiones web/app<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Cookies, contexto, URL, dispositivo<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"channel-example\">Ejemplo · <a href=\"https://www.xataka.com/\" target=\"_blank\" rel=\"noopener\">www.xataka.com →<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"video\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Audiencias + reproducciones de vídeo (impresiones de vídeo)<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Contenido · Hogar · TV · Login<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"retail\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Compradores<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Historial · Productos · Intención<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"dooh\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Impactos<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Ubicación · Hora · Tráfico<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"audio\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Reproducciones<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Programa · Momento · Dispositivo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"channel-detail\" data-channel-panel=\"gaming\" hidden=\"\">\n        <div class=\"vs\">\n          <div><b>¿Qué se compra?<\u002Fb>Jugadores<\u002Fdiv>\n          <div><b>Señales principales<\u002Fb>Juego · Nivel · Sesión<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- RTB: la lógica de compra antes de entrar en formatos -->\n    <div class=\"panel-card acc-teoria\" data-reveal=\"\">\n      <p class=\"blocktitle\" style=\"color:var(--teoria)\">Antes de seguir: ¿qué es RTB?<\u002Fp>\n      <p class=\"blocklead\"><b>RTB (Real-Time Bidding)<\u002Fb> es el modo de compra y venta de espacios publicitarios mediante <b>subastas automáticas en milisegundos<\u002Fb>. Cada vez que se carga una página, la impresión se subasta en tiempo real al mejor postor.<\u002Fp>\n      <div class=\"callout\" style=\"border-left:3px solid var(--teoria); background:var(--teoria-bg); margin-top:14px;\">\n        <p style=\"margin:0\">El <b>display web<\u002Fb> es la puerta de entrada para entender el RTB, pero no confundas los planos: RTB es una <b>lógica de compra<\u002Fb> dentro de la programática, <b>no es un formato<\u002Fb>. El display es el formato; el RTB es cómo se compra.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- El display en 2025: antes → ahora -->\n    <div class=\"panel-card acc-practica\" data-reveal=\"\">\n      <p class=\"evo-headline\">El display no desaparece, <b>cambia de forma<\u002Fb>.<\u002Fp>\n      <div class=\"evo-grid\">\n        <div class=\"evo-col before\">\n          <p class=\"evo-eyebrow\">Antes · display era casi sinónimo de<\u002Fp>\n          <h4>Formatos fijos (estándar IAB)<\u002Fh4>\n          <div class=\"evo-chips\" data-evo-chips=\"\">\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"robapaginas\">MPU/Robapáginas/Medium Rectangle<\u002Fbutton><button type=\"button\" class=\"evo-chip-btn\" data-evo=\"leaderboard\">Leaderboard<\u002Fbutton><button type=\"button\" class=\"evo-chip-btn\" data-evo=\"billboard\">Billboard/Megabanner<\u002Fbutton>\n            <button type=\"button\" class=\"evo-chip-btn\" data-evo=\"halfpage\">Half Page / Media página<\u002Fbutton>\n          <\u002Fdiv>\n          <div cl
